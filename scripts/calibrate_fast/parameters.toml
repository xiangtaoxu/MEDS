# The fast-parameter registry (docs/dev_plans/MEDS_FAST_CALIBRATION_PLAN.md §4, §14): the keys a
# flux-tower fit of ten-day windows may move, for a closed tropical evergreen canopy. One table per
# key:
#
#   file      = "pft" (the PFT TOML) or "main"
#   key       = the dotted TOML key as MEDS reads it
#   pft       = the element of a per-PFT array (1-based; default 1)
#   range     = [lo, hi]: the prior's +-2 sigma band and a hard bound (§6.1)
#   transform = "linear" (logit on the range) or "log" (log, then logit): a positive scale is "log"
#   default   = only where neither the base TOML nor the model's parameter record gives one
#   variants  = only in these variants of the site declaration
#
# Ranges are the plan's. The leaf angle's lower bound is 30 degrees, not the plan's 45, because
# the transform needs the default (45) strictly inside; the NIR transmittance stops at 0.40 so
# that reflectance plus transmittance stays below 1 at the corner of the box.
#
# A key is here only if a ten-day window can set it (plan §14). These are left at their defaults:
#   - the tower cannot inform them (the screening's posterior/prior sigma ratio is 0.9 or more):
#     leaf_reflect_vis, leaf_transmit_vis, k_plant_max, wood_psi50, psi_wilt, stem_resp_factor25,
#     root_resp_factor25, resp_temp_increase;
#   - they act through the soil water a ten-day window does not draw down, so a frozen window rewards
#     a value that dries the soil months later: wstress_sref_stomata, root_beta, and leaf_pi0, whose
#     response is also a step (the screening finds it rough);
#   - they repeat another key: d_ratio moves the fluxes as z0m_ratio does (correlation -0.996);
#   - they are a floor or a constant of the numerical scheme, not a property of the canopy: ustmin,
#     canopy_freeboard;
#   - they are leaf biochemistry that the tower's GPP cannot tell apart from vcmax25:
#     jmax_vcmax_ratio, theta_j, ds_vcmax.

# ----- radiation (§4.1) --------------------------------------------------------------------------
[leaf_reflect_nir]
file = "pft"
key = "pft.leaf_reflect_nir"
range = [0.30, 0.55]
group = "radiation"
source = "broadleaf NIR reflectance; plan §4.1"

[leaf_transmit_nir]
file = "pft"
key = "pft.leaf_transmit_nir"
range = [0.15, 0.40]
group = "radiation"
source = "broadleaf NIR transmittance; plan §4.1 (upper bound 0.40 here)"

[leaf_clumping]
file = "pft"
key = "pft.leaf_clumping"
range = [0.50, 1.00]
group = "radiation"
source = "foliage clumping index of closed broadleaf canopies; plan §4.1"

[leaf_angle_mean]
file = "pft"
key = "pft.leaf_angle_mean"
range = [30.0, 65.0]
group = "radiation"
source = "mean leaf inclination [deg]; spherical is 57.3; plan §4.1 (lower bound 30 here)"

# ----- photosynthesis and stomata (§4.2) ----------------------------------------------------------
[vcmax25]
file = "pft"
key = "pft.vcmax25"
range = [25.0, 80.0]
transform = "log"
group = "photosynthesis"
source = "tropical evergreen top-of-canopy Vcmax25 (Kattge et al. 2009); plan §4.2"

[stomatal_g1]
file = "pft"
key = "pft.stomatal_g1"
range = [1.5, 6.0]
transform = "log"
group = "photosynthesis"
source = "Medlyn g1 [kPa^0.5] (Medlyn et al. 2011; Lin et al. 2015); plan §4.2"

[stomatal_g0]
file = "pft"
key = "pft.stomatal_g0"
range = [0.001, 0.05]
transform = "log"
group = "photosynthesis"
source = "residual stomatal conductance [mol m-2 s-1]; plan §4.2"

# ----- energy partition and aerodynamics (§4.3) -----------------------------------------------------
[z0m_ratio]
file = "main"
key = "aerodynamics.z0m_ratio"
range = [0.05, 0.20]
group = "aerodynamics"
source = "roughness length / canopy height; plan §4.3"

[leaf_width]
file = "pft"
key = "pft.leaf_width"
range = [0.02, 0.15]
transform = "log"
group = "aerodynamics"
source = "characteristic leaf width [m]; plan §4.3"

[dsl_dmax]
file = "main"
key = "soil.dsl_dmax"
range = [0.005, 0.05]
transform = "log"
group = "evaporation"
source = "maximum dry surface layer [m]; plan §4.3"

[dewmx]
file = "main"
key = "soil.dewmx"
range = [0.05, 0.3]
transform = "log"
group = "interception"
variants = ["interception_on"]
source = "leaf-film water capacity [kg m-2 per unit LAI]; plan §4.3 (interception on)"

[intercept_k]
file = "main"
key = "soil.intercept_k"
range = [0.3, 0.8]
group = "interception"
variants = ["interception_on"]
source = "interception extinction coefficient; plan §4.3 (interception on)"

# ----- respiration (§4.5) ---------------------------------------------------------------------------
[rd_vcmax_ratio]
file = "pft"
key = "pft.rd_vcmax_ratio"
range = [0.008, 0.025]
group = "respiration"
source = "leaf dark respiration / Vcmax at 25 C; plan §4.5"
