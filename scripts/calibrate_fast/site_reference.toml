# SPDX-License-Identifier: Apache-2.0
# =====================================================================================================
# calibrate_fast -- the SITE DECLARATION REFERENCE: every setting a site's calibration.toml may hold,
# with the value the tool uses when the site leaves it out, and why that is the recommendation
# (docs/dev_plans/MEDS_FAST_CALIBRATION_REVISION_PLAN.md §2-§8).
#
# This file IS the tool's schema. A key a site file sets that is not here stops the tool (a
# misspelling would otherwise silently keep the default), and every value below is the default --
# except the REQUIRED ones, marked so, whose values here are examples. Tables marked FREE take any
# keys (model config keys, or names the site chooses).
# =====================================================================================================

[base]
main        = "meds_config_eval.toml"   # REQUIRED. The main TOML of the base run; the PFT file is the one it names in [init].pft_config.
registry    = "../../scripts/calibrate_fast/parameters.toml"   # REQUIRED. The parameter registry (the menu of keys, ranges, priors).
growth_resp = ""                        # Monthly growth-respiration climatology (calibrate_fast.py growth-resp), added to the
                                        #   model's night NEE. Only the nee_night target uses it; "" = none.

# FREE: model config keys set in every run of the calibration (main-file keys, dotted), e.g.
#   "trait_dynamics.trait_plasticity_on" = true
[overrides]

# FREE: named variants, each a table of model config keys on top of [overrides] (--variant NAME), e.g.
#   [variants.interception_on]
#   "fast.canopy_water_on" = true
[variants]

# The tower. Its FACTS -- the file, format, clock, sensor heights, every column and its units, which
# values were measured, and what the provider did -- are its site TOML, the one the forcing build
# reads (scripts/prepare_flux_tower; [fluxes] and [provider] there). Only the calibration's CHOICES
# about the data are here.
[tower]
site         = "bci_site.toml"    # REQUIRED. The tower's site TOML (scripts/prepare_flux_tower/README.md). Its
                                  #   [fluxes] give the targets' data and the rule that says which values were measured;
                                  #   recommended: measured only. A gap-filled value is a gap-filling model's prediction,
                                  #   not data, even when (as at BCI) it carries the same light response.
forcing      = ""                 # The run's forcing file, for the observed-forcing mask ("" = no mask).
forcing_qc   = ["LWdown_qc", "Wind_qc"]   # Forcing qc variables that must be 0 (observed) in calibration windows: a
                                          #   trial driven by gap-filled forcing scores the gap filling.
forcing_qc_val = ["Wind_qc"]      # The same for validation windows (a tower year without longwave still validates).
forcing_grid = 1                  # The forcing file's grid cell (1-based).
closure      = "none"             # "none": H and LE as measured. "bowen": FLUXNET2015's energy-balance-closure
                                  #   correction, H and LE scaled together so H + LE = Rnet with the Bowen ratio kept.
                                  #   Recommended "none": at BCI the gap (H + LE = 0.72 Rnet) behaves like missing
                                  #   sensible heat, not missing LE. As turbulence rises (u* 0.3 -> 1.0, 10-15 h, within
                                  #   a VPD class) H/Rnet climbs 0.21 -> 0.38 while LE/Rnet stays at 0.42-0.48, and the
                                  #   midday gap grows with H, not LE (gap = 0.30 H - 0.26 LE + 165 W m-2). The Bowen
                                  #   correction would raise LE by ~39 % that the data do not show; instead H is
                                  #   filtered harder and given a wider sigma ([targets.h]).
closure_days = 31                 # The "bowen" correction's sliding window [local days], centred.
daytime_sw   = 10.0               # [W m-2] incoming shortwave above which a record is daytime (every daytime target).

[windows]
days       = 10                   # A calibration window's length [days]. Ten frozen days set the fast keys; the
                                  #   water-stress keys need the seasonal runs ([windows.seasonal]).
skip_hours = 0                    # Hours dropped at each window's start (the restart's first hours).
chain_lead_days = 180             # Every window restarts from its own state: a frozen run from the initial stand (the
                                  #   base config's census or state) that starts this many days before the window, so
                                  #   the soil water and temperature are the model's own. Half a year spans a wet season
                                  #   before any dry-season window.
# The windows are chosen by the rule (best-practice plan §6.2) unless the site lists them: one calibration window per
# slot of the year (`slots` equal slots, 1.5 months for 8) inside the site TOML's leaf-on months, each the slot's
# best covered -- the share of daytime records with H, LE and GPP measured, times the share with observed forcing --
# and a validation window in the same slot of another year. `select-windows` prints the choice.
slots      = 8
min_score  = 0.5                  # a window's mean daily coverage must reach this
# EXAMPLE: the site's own windows (name, start [UTC date], role "cal" or "val", optionally days); empty = the rule.
list       = [ { name = "example", start = "2015-09-11", role = "cal" } ]

# The seasonal runs (soil drying): frozen runs long enough for the soil to dry, scored on LE only (the water stage of
# the fit). By the rule, up to max_runs runs, each ending at a year's deepest cumulative water deficit (rain minus
# Priestley-Taylor evaporation, from the forcing file) inside the leaf-on months, the deepest years first; a year
# whose deficit stays under min_deficit_mm gives none, and without any the drought keys are fixed.
[windows.seasonal]
days           = 120
max_runs       = 2                # 0 = no seasonal runs
min_deficit_mm = 100.0
# EXAMPLE: the site's own runs (name, start, days); empty = the rule.
list           = [ { name = "dry2016", start = "2016-01-01", days = 120 } ]

# The u* diagnostic (best-practice plan §2.3): within classes of each target's driver (PAR for GPP, Rnet for LE and
# H), the flux-to-driver ratio across u* classes; the plateau test finds the lowest class within `crit` of the mean
# of the classes above (Papale et al. 2006), and a bootstrap over days its spread (Barr et al. 2013). Measured
# daytime records only.
[ustar]
crit              = 0.95
edges             = [0.0, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.5, 0.6, 0.8, 3.0]   # the u* classes [m s-1]
driver_classes    = 4             # equal-count classes of the driver
min_driver        = { par = 100.0, rnet = 50.0 }   # [umol m-2 s-1, W m-2] dimmer records make a ratio of small numbers
min_class_records = 15            # a u* class with fewer records is skipped
min_records       = 500           # fewer records in all: no diagnostic (GPP then takes the provider's threshold)
n_boot            = 200
seed              = 1

# ----- TARGETS -------------------------------------------------------------------------------------------
# Every target takes:
#   on                   use it
#   sigma, or sigma_abs and sigma_rel   its observation error: sigma = sigma_abs + sigma_rel |obs|
# and these FILTERS, applied in this order after the target's own definition (each documented in
# residuals.py; a filter left out is off):
#   ustar_min            u* at or above [m s-1] (refused on the u* target: it would bias it): a number, "provider"
#                        (the site TOML's [provider].ustar_threshold, one value or one per year) or "diagnostic"
#                        (the target's own u* diagnostic: filtered at a plateau, not at all when the ratio is flat
#                        or still rising)
#   par_min              incident PAR at or above [umol m-2 s-1] (needs the site TOML's variables.PAR)
#   hours                local hours [from, to)
#   closure_range        days whose own closure ratio sum(H + LE) / sum(Rnet) lies in [lo, hi]. Off by default:
#                        at BCI only 11 % of days fall in [0.8, 1.2], so it keeps too little and a skewed sample.
#   min_solar_elevation  the sun at least this high [degrees]
#   snow_free_days       no freezing air for this many days before (a tower has no snow sensor in its columns)
# H, LE and u* are daytime targets (incoming shortwave above [tower].daytime_sw): at night they are set mostly by
# the model's numerical floors and by stable-air measurement problems. `night = true` keeps their night records too,
# at the provider's u* threshold.
[targets.albedo]
on       = true
sigma    = 0.01
min_sw   = 200.0                  # [W m-2] only records with this much incoming shortwave (a ratio of small numbers is noise)
min_solar_elevation = 20.0        # [deg] low-sun albedo is the least reliable (the plan's albedo rule)
snow_free_days = 7                # snow is a different surface from the one the keys describe

[targets.lw_up]
on    = true
sigma = 5.0                       # [W m-2]

[targets.rnet]
on        = false                 # Off by default: a four-component radiometer's Rnet is Rs - Rs_up + LW_down - LW_up
                                  #   (at BCI to 1e-11 W m-2), and the model takes Rs and LW_down from the tower as
                                  #   forcing, so the Rnet residual is minus the albedo's and the upwelling longwave's:
                                  #   it would count them twice. Turn it on for a net radiometer measured on its own.
sigma_abs = 10.0                  # [W m-2]
sigma_rel = 0.05

[targets.le]
on        = true
sigma_abs = 10.0                  # [W m-2]; random error grows with the flux (Richardson et al. 2006)
sigma_rel = 0.15
closure   = false                 # true: compare with the closure-corrected LE ([tower].closure = "bowen")
ustar_min = "diagnostic"          # LE/Rnet is flat in u* at BCI, so no filter
night     = false

[targets.h]
on        = true
sigma_abs = 10.0
sigma_rel = 0.30                  # wider than LE's 0.15: no u* threshold recovers the missing sensible heat at BCI
                                  #   (H/Rnet still rises above u* 1.0), so H stays biased low by an unknown amount
closure   = false
ustar_min = "diagnostic"          # H/Rnet still rises at the top u* classes at BCI, so no filter: the missing sensible
                                  #   heat is the observation model's to handle, not a filter's
night     = false

[targets.ef]
on        = false                 # Off by default: the measured EF is biased high where closure is poor (at BCI 0.70
                                  #   at u* < 0.4 against 0.54 above 0.8), the same missing sensible heat as H's
sigma     = 0.05                  # the daily daytime evaporative fraction LE / (H + LE), uncorrected
min_hours = 6                     # a day counts with at least this many measured daytime hours

[targets.gpp]
on        = true
sigma_abs = 2.5                   # [umol m-2 s-1] Recommended 2.5 for a tower whose GPP is built from ONE respiration
sigma_rel = 0.15                  #   value per day (GPP = R_day - NEE). Such a respiration can be ~2 umol m-2 s-1 off at
                                  #   EVERY daytime hour (BCI: about the soil chambers' alone, without the above-ground
                                  #   part), on top of the random error (1.5 + 0.15 GPP). 2.5 + 0.15 GPP is the linear form of sqrt((1.5 + 0.15 GPP)^2
                                  #   + 2^2): equal at GPP 0, 12 % wider at GPP 20. It down-weights the dim hours, where
                                  #   that error is largest relative to GPP; 1.5 is right for a GPP partitioned by hour.
ustar_min = "provider"            # the provider's CO2 threshold (the ONEFlux convention; BCI 0.4): low turbulence after
                                  #   sunrise under-reads uptake. The daytime plateau of the u* diagnostic is the
                                  #   declared alternative.

[targets.nee_night]
on        = false                 # Off by default: night fluxes under-read in low turbulence, the frozen soil carbon makes
                                  #   heterotrophic respiration a spin-up quantity, and at BCI the target pulled
                                  #   rd_vcmax_ratio to its floor. Fix rd_vcmax_ratio instead (the registry does).
sigma     = 2.0                   # [umol m-2 s-1]
ustar_min = 0.4                   # [m s-1] if turned on: the provider's threshold for this tower
night_sw  = 5.0                   # [W m-2] incoming shortwave below which an hour is night

[targets.ustar]
on        = true
sigma_abs = 0.1                   # [m s-1] loose: the tower measures u* in the roughness sublayer
sigma_rel = 0.2
night     = false

# ----- THE FIT -------------------------------------------------------------------------------------------
[fit]
# Which keys: the registry's `state = "fit"` keys by default. Set `keys` (the exact list; a fixed key may be named),
# or `add` / `remove` (edits of the default set) -- not both. Unknown names stop the tool.
#   keys   = ["vcmax25", "stomatal_g1"]
#   add    = ["theta_j"]
#   remove = ["leaf_angle_mean"]
stages     = ["energy", "water", "polish"]   # the staged fit (plan §7, §13), in this order. "optics" (the two-stream
                                  #   alone, against the albedo) and "photosynthesis" (a canopy of leaf solves, against
                                  #   GPP) are optional: a kernel stage not listed has its keys fitted in "energy", with
                                  #   every target. Recommended without them: at BCI the albedo alone sent clumping to
                                  #   its floor, and the joint fit then moved it to its ceiling. ["polish"] alone is the
                                  #   joint fit of every key at once (the original method)
screening  = "report"             # "report": the first Jacobian's screening is reported, every requested key is fitted;
                                  #   "drop": keys the tower cannot inform (sigma ratio >= 0.95), dead or rough are fixed
weights    = "ess"                # "ess": each target's rows weighted by its effective sample size, from the lag-1
                                  #   autocorrelation of its residuals, in the fit as in the covariance; "none": every row 1
loss       = "l2"                 # "l2" (least squares) or "huber" (robust: a row's pull is capped at huber_c sigma)
huber_c    = 2.0
seed       = 1
timeout    = 900.0                # [s] the floor of a trial's timeout (3x the median of completed trials, if longer)
rough_keys = "default"            # "default": a rough key (a step response) the screening drops stays at its default;
                                  #   "line_search": set by a 1-D search (at BCI that broke the five-year water budget)
max_free   = 20                   # with screening = "drop": at most this many keys, the best informed
min_process_records = 48          # a key that acts through one process (the registry's `process`: wet canopy, night,
                                  #   snow, drought) is fixed when the kept records sample it fewer times than this

# FREE (key names from the registry): a key's prior and range, over the registry's.
#   [priors.vcmax25]
#   centre = 45.0                  # the prior's centre (theta units); also where the fit starts
#   sd     = 8.0                   # its sd (theta units); or log_sd (log theta) for a log key
#   range  = [25.0, 80.0]          # its bounds
#   source = "site leaf data"
# A narrow prior holds a key near its centre but lets strong evidence nudge it; a wide one lets the data decide.
[priors]

[stages.optics]
max_iter = 15                     # the radiation solver alone against the albedo (meds.canopy): seconds per iteration

[stages.photosynthesis]
passes   = 3                      # outer passes: re-run the windows with the new leaf keys, refresh the leaf drivers, refit
tol      = 0.01                   # stop when no key moves by more than this fraction between passes
max_iter = 20                     # the canopy of leaf kernels against GPP (meds.canopy), per pass

[stages.energy]
max_iter = 10                     # the coupled fast loop (Levenberg-Marquardt on 10-day trials)
rtol     = 1.0e-3

[stages.water]
# The seasonal runs of [windows.seasonal]; none = the stage is skipped.
targets    = ["le"]               # the targets these runs are scored on: LE only, since a GPP with a biased
                                  #   respiration set the strongest stress when it scored them
grid_sigma = 1.0                  # the first grid: the starting value (the prior centre) +- this many prior sds in u
rounds     = 2                    # grids (each half the last's width around the best point), then a local quadratic

[stages.polish]
max_iter      = 10                # every fitted key together from the stage values, then the final Jacobian. rtol
                                  #   ends it sooner; at BCI 3 iterations left it still falling 4 % per iteration, a
                                  #   Gauss-Newton step of up to 19 posterior sd short of its optimum
rtol          = 1.0e-3
include_water = true              # the seasonal runs enter as residual blocks too
refresh       = true              # re-run the state chains with the stage values first

[uncertainty]
linearity_dirs = 3                # the linearity check: +-1 sd along this many leading directions
# FREE: an alternative filter for the filter sensitivity (plan §8.5), target -> settings; the MAP's shift under it
# is estimated from the final Jacobian with no new runs. Empty = no sensitivity.
#   alternative = { gpp = { ustar_min = 0.3 } }
alternative = {}

# FREE: model config keys written into the calibrated main TOML (e.g. its output prefix).
[calibrated]
