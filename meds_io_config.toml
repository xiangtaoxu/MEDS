# Point the main config at this file with [output].io_config = "meds_io_config.toml".
# Entries here are the FINEST granularity and OVERRIDE the axis / group / per-tier
# switches in the main config.
#
#   name = true      -> force ON at the variable's registry-default streams
#   name = false     -> force OFF everywhere
#   name = "F D M Y" -> replace the stream mask (F fast, D daily, M monthly, Y annual;
#                       Y is forbidden on a cohort- or patch-dimensioned variable)
#
# A name that matches no registered variable is a hard error, not a silent no-op.
# Every line below is commented out, so this file as generated changes nothing.

