# SPDX-License-Identifier: Apache-2.0
# The site config test_region derives its region and site configs from: one deciduous PFT at
# Ithaca NY, fast biophysics on. The test prepends an override block (the synthetic ERA5-Land
# archive, a bare-ground start, a 12-day window) and drops the keys region mode rejects, so only
# the keys below that it leaves alone matter. CMakeLists.txt runs the test in this folder.
[run]
dt_slow    = "1d"
start_time = "2074-07-01"
end_time   = "2074-08-01"

[fast]
fast_probe      = true
fast_probe_file = "out/fast_probe.csv"
fast_biophysics_on  = true
dt_fast             = "900s"
time_integrator     = "ark"
ark_adaptive        = true
ark_rtol            = 1.0e-3

[demography]
demography_on             = true
do_cohort_fissfuse        = true
do_patch_disturbance      = true
do_patch_fissfuse         = true
max_cohort                = 60
n_cohort_fusion_iter      = 6
cohort_size_tol_min       = 0.02
cohort_size_tol_max       = 0.10
cohort_lai_cap            = 1.0
min_cohort_agb            = 1.0e-6
negligible_nplant         = 1.0e-8
split_eps                 = 1.0e-4
enable_cohort_fission     = true
n_height_layers           = 16
max_patch                 = 12
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10
patch_light_tol_max       = 0.15
patch_light_maxdev_factor = 1.5
patch_diff_age_tol        = 1.0
min_patch_area            = 1.0e-4
patch_min_area_remain     = 0.99
enable_patch_fission      = false
conservation_tol          = 0.001
growth_memory_days        = 90.0

[disturbance]
patch_disturbance_rate     = 0.014
disturbance_survive_height = 10.0

[recruitment]
min_recruit_size = 1.0e-2

[init]
init_mode    = 2
restart_file = "spinup-S-20740701000000.nc"
census_file  = "none"
pft_config   = "pft_parameters.toml"

[state]
output_dir            = "."
output_prefix         = "july"
write_state           = false
interval_years  = 1

[output]
enabled       = true
dir           = "out"
prefix        = "july"
io_config     = "output_variables.toml"
cohort_max    = 4096
patch_max     = 256
sync_every    = "flush"
structure     = true
carbon        = true
water         = true
energy        = true
fast_interval_steps = 4
[output.fast]
enabled    = true
file_chunk = "day"
[output.daily]
enabled    = true
file_chunk = "month"
[output.monthly]
enabled    = false
file_chunk = "year"
[output.annual]
enabled    = false
file_chunk = "run"

[options]
override_derived = false

[carbon]
gpp_ref       = 0.3

[leaf_physiology]
stomatal_model     = "medlyn"
temp_response_form = "peaked"
colimitation       = "quadratic"
use_boundary_layer = false
wstress_nonstomatal = false
kc25    = 40.49
ko25    = 27840.0
gstar25 = 4.275
ea_kc     = 79430.0
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209
leaf_absorptance = 0.85
phi_psii         = 0.85

[site]
latitude              = 42.44
longitude             = -76.50
elevation             = 320.0
apply_elevation_lapse = true
lapse_rate_tair       = 0.0065
grid_elevation        = 367.5

[forcing]
forcing_on     = true
tq_height            = 2.0
wind_height          = 10.0
height_above         = "zero_plane"
wind_exposure        = "open_terrain"
wind_exposure_z0     = 0.03
wind_blending_height = 40.0
format         = "ED_default"
path           = "../../data/forcing/ithaca_forcing.nc"
grid_index     = 1
grid_match     = "explicit"
timestep       = "3600s"
avg_convention = "end"
sw_partition   = "clearidx"
lwdown_source  = "file"
co2_const      = 420.0
recycle        = true
recycle_start  = "2024-01-01 01:00:00"
recycle_end    = "2025-01-01 01:00:00"
start_clamp    = "hold"

[soil_carbon]
soil_carbon_on = true

[energy]
bottom_bc = "dirichlet"
deep_temp = 284.75
