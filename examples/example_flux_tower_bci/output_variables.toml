# The variables the BCI evaluation run writes: the hourly fluxes and states the tower also measures,
# the forcing as the model saw it, and daily stand structure. Tiers: F = sub-daily (hourly here,
# fast_interval_steps = 4), D = daily. Every stamp is UTC.
[variables]
sw_in_fast           = "F"   # incoming shortwave, as the model disaggregated it
lwdown_fast          = "F"   # downward longwave at the canopy top (the forcing)
rnet_fast            = "F"   # net all-wave radiation      <-> the tower's Rnet
le_flux_fast         = "F"   # latent heat flux            <-> LE
h_flux_fast          = "F"   # sensible heat flux          <-> H
gpp_rate_fast        = "F"   # gross primary productivity  <-> gpp
nee_fast             = "F"   # net ecosystem exchange      <-> NEE
ustar_fast           = "F"   # friction velocity           <-> ustar
air_temp_fast        = "F"   # the forcing's air temperature, at the tower height
qair_fast            = "F"   # the forcing's specific humidity, from RHair by the model's curve
psurf_fast           = "F"   # the forcing's pressure, at the ground
wind_fast            = "F"   # the forcing's wind, at the tower height
rainf_fast           = "F"   # the forcing's rain
cas_temp_fast        = "F"   # canopy-air-space temperature
soil_water_site_fast = "F"   # volumetric soil moisture, all layers  <-> SWC (0-15 cm)
lai_site             = "D"
agb_site             = "D"
canopy_height_site   = "D"
lw_up_site           = "D"   # upwelling longwave          <-> Rl_dn (the file swaps the two)
et_site              = "D"
precip_site          = "D"
cas_depth_patch      = "D"   # each patch's canopy-air top, the height the forcing is moved to
air_temp_cas_top_patch = "D" # the forcing temperature at that top
wind_cas_top_patch   = "D"   # the forcing wind at that top
area_patch           = "D"
sw_up_fast           = "F"   # shortwave leaving the canopy top  <-> Rs_dn
lw_up_fast           = "F"   # longwave leaving the canopy top    <-> Rl_dn (the file swaps the two)
growth_resp_site     = "D"   # growth respiration: the calibration adds it to the frozen night NEE
