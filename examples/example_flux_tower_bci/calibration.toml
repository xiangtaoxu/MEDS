# SPDX-License-Identifier: Apache-2.0
# The fast-parameter calibration at Barro Colorado Island (scripts/calibrate_fast;
# docs/dev_plans/MEDS_FAST_CALIBRATION_PLAN.md and MEDS_FAST_CALIBRATION_REVISION_PLAN.md).
# run_example.py --calibrate runs it. Every setting, its default and why: scripts/calibrate_fast/site_reference.toml.
# Paths are relative to this file.

[base]
main        = "meds_config_eval.toml"                # with the PFT file it names, pft_parameters.toml
registry    = "../../scripts/calibrate_fast/parameters.toml"
growth_resp = "calibration/growth_resp_monthly.csv"   # calibrate_fast.py growth-resp, from the five-year run

# Applied to every trial and every state chain.
[overrides]
"trait_dynamics.trait_plasticity_on" = true   # D6: the traits follow the canopy light gradient

# Canopy interception both ways (D9).
[variants.interception_off]
"fast.canopy_water_on" = false

[variants.interception_on]
"fast.canopy_water_on" = true

# The tower's facts (file, clock, columns, units, which values were measured) are bci_site.toml,
# the forcing build's own; only the calibration's choices are here.
[tower]
site         = "bci_site.toml"
forcing      = "data/bci_forcing.nc"          # the hours whose forcing was observed
forcing_qc   = ["LWdown_qc", "Wind_qc"]
forcing_grid = 1
closure      = "none"          # H and LE as measured: the closure gap behaves like missing sensible heat
                               #   (site_reference.toml [tower].closure), so H is filtered harder instead
daytime_sw   = 10.0            # [W m-2]

[targets.albedo]
sigma = 0.01
min_sw = 200.0

[targets.lw_up]
sigma = 5.0

# Rnet is the four radiation components summed (to 1e-11 W m-2), so the albedo and the upwelling
# longwave already hold it; EF is biased high where closure is poor (site_reference.toml).
[targets.rnet]
on = false

[targets.ef]
on = false

# LE and H as measured, daytime only, with the u* rule of the diagnostic: LE/Rnet is flat in u* and
# H/Rnet still rises at the top classes, so neither is filtered (site_reference.toml). H keeps a
# wider sigma: the tower misses sensible heat.
[targets.le]
sigma_abs = 10.0
sigma_rel = 0.15
closure = false

[targets.h]
sigma_abs = 10.0
sigma_rel = 0.30
closure = false

# GPP: the tower's is built from one respiration value per day (GPP = R_day - NEE), about the soil
# chambers' alone (without the above-ground part), so sigma carries ~2 umol m-2 s-1 of systematic
# error; the provider's u* threshold (0.4, bci_site.toml) filters the calm morning hours.
# site_reference.toml explains both.
[targets.gpp]
sigma_abs = 2.5
sigma_rel = 0.15

# Night NEE is out of the fast fit (revision plan decision 3): rd_vcmax_ratio is fixed instead.
[targets.nee_night]
on = false

[targets.ustar]
sigma_abs = 0.1
sigma_rel = 0.2

[fit]
stages     = ["energy", "water", "polish"]   # optics and photosynthesis keys fitted with the coupled loop
screening  = "report"
weights    = "ess"
seed       = 20260929
rough_keys = "default"       # a key the screening finds rough stays at its default ("line_search" to move it)
timeout    = 300             # [s] the floor of the trial timeout; a 10-day trial takes 8-60 s by load

[uncertainty]
alternative = { gpp = { ustar_min = 0.3 } }

# The windows and seasonal runs are chosen by the rule (best-practice plan §6.2; `calibrate_fast.py
# select-windows` prints them): eight ten-day windows, one per 1.5-month slot, each the slot's best
# covered, with validation windows in the same slots of other years; and the soil-drying runs from
# the years' deepest water deficits (2016's is the El Nino drought).
[windows]
days       = 10
skip_hours = 3                 # the first hours after a restart with changed traits are not scored

# Set in the calibrated main config the fit writes (meds_config_calibrated.toml), beside the MAP.
[calibrated]
"init.pft_config" = "calibration/pft_parameters_calibrated.toml"
"output.prefix"   = "cal"
