# SPDX-License-Identifier: Apache-2.0
# The PFT of example 04 at Barro Colorado Island: ONE evergreen broadleaf PFT at a mid-successional
# wood density, for the whole census. Its fast parameters are the calibration's starting point
# (calibration/ holds the fitted file). BCI's drought-deciduous and liana components are not
# represented.
# Every per-PFT array has length 1 (the PFT count = length of [pft].wood_density).

[pft]
wood_density       = [0.60]      # [g/cm3] mid-successional
# Wood area and sapwood allometry (ED2 ed_params.f90, tropical broadleaf).
wai_b1             = [0.0096]    # [--] ED2 b1WAI = 0.0192*0.5
wai_b2             = [2.0947]    # [--] ED2 b2WAI
sapwood_area_b1    = [1.582]     # [cm2/cm^b2] ED2 b1SA
sapwood_area_b2    = [1.764]     # [--]        ED2 b2SA

#----- Canopy-element geometry for the aerodynamic boundary layers.
leaf_width         = [0.04]     # [m]  characteristic leaf width
branch_diameter    = [0.02]     # [m]  characteristic branch diameter
crown_area_frac    = [1.0]      # [--] crown area as a fraction of the patch
dbh_critical       = [100.0]     # [cm] maximum diameter
hgt_max            = [46.0]      # [m] asymptotic max height (allometry cap)
reproduction_investment_fraction = [0.3]
recruit_carbon_efficiency          = [1.0e-3]
seed_rain_recruits = [0.01]      # [plant/m2/yr]
include_pft        = [1]
min_cohort_height       = 2.0    # [m] shared scalar (recruit/birth size)
min_reproduction_height = 20.0   # [m] shared scalar
# Leaf photosynthesis / stomatal traits (C3).
photosynthetic_pathway = [1]
vcmax25            = [45.0]
jmax_vcmax_ratio   = [1.7]
tpu_vcmax_ratio    = [0.167]
rd_vcmax_ratio     = [0.015]
kp25               = [1.0e-9]
stomatal_g0        = [0.01]
stomatal_g1        = [3.0]        # Medlyn [kPa^0.5]
stomatal_d0        = [1500.0]
quantum_yield_c4   = [0.0]
theta_j            = [0.70]       # the effective curvature of a mean-light cohort (#351; CLM5, ED2)
theta_cj_c3        = [0.98]                        # [--] C3 Ac/Aj co-limitation curvature (#118; NOT theta_j)
theta_ip_c3        = [0.95]                        # [--] C3 (Ac,Aj)/Ap co-limitation curvature (#118)
theta_cj_c4        = [0.80]
theta_ic_c4        = [0.95]
katul_lambda25     = [800.0]
wstress_psi_open   = [-0.5]
wstress_psi_close  = [-3.0]
wstress_lambda_exp = [1.0]
wstress_sref_stomata = [2.0]     # [1/MPa] Sabot stomatal-stress sensitivity
# Carbon-dynamics traits.
sla                    = [13.0]
root_to_leaf_ratio     = [1.0]
huber_value            = [1.5e-4]
aboveground_frac       = [0.7]

#----- Non-leaf maintenance respiration (leaf Rd is rd_vcmax_ratio above).
is_woody           = [1]     # 1 = woody (0 = grass: no stem respiration)
stem_resp_factor25 = [0.06]  # [umol CO2/m2 stem/s @25C]
root_resp_factor25 = [0.30]  # [umol CO2/kgC fine root/s @25C]

#----- CANOPY OPTICS (the two-stream's per-PFT table). Shortwave as reflectance + transmittance
#      per band; LONGWAVE as EMISSIVITY, because that is the number anyone has for a leaf -- the
#      band's reflectance is 1 - emissivity and its transmittance is 0 (a leaf is opaque at
#      thermal wavelengths). Validated at load: reflect + transmit is the single-scatter albedo
#      and must stay BELOW 1, or a scattering layer conserves or creates energy.
leaf_reflect_vis   = [0.10]   # [--] leaf VIS reflectance
leaf_transmit_vis  = [0.05]   # [--] leaf VIS transmittance
leaf_reflect_nir   = [0.45]   # [--] leaf NIR reflectance
leaf_transmit_nir  = [0.25]   # [--] leaf NIR transmittance
leaf_emissivity    = [0.97]    # [--] leaf thermal emissivity
wood_reflect_vis   = [0.11]   # [--] wood/bark VIS reflectance
wood_transmit_vis  = [0.001]   # [--] wood/bark VIS transmittance (near-opaque)
wood_reflect_nir   = [0.25]   # [--] wood/bark NIR reflectance
wood_transmit_nir  = [0.001]   # [--] wood/bark NIR transmittance
wood_emissivity    = [0.90]    # [--] wood thermal emissivity
leaf_clumping      = [0.80]    # [--] leaf clumping factor in (0,1]
wood_clumping      = [0.50]    # [--] wood clumping factor in (0,1]
leaf_angle_mean    = [45.0]   # [deg] mean leaf inclination (spherical: mean 57.3, std 21.6)
leaf_angle_std     = [20.0]   # [deg] its standard deviation
storage_cushion        = [1.0]
growth_resp_factor     = [0.3]
leaf_lifespan_toc      = [2.0]   # [yr] (= 1/0.5)
fineroot_turnover_rate = [0.8]   # [1/yr]
wood_carbon_density    = [300.0] # [kgC/m3]
# Necromass -> litter-destination split, as the reference meds_config_pft.toml's mid-successional PFT.
f_labile_leaf          = [0.70]  # [--] labile fraction of leaf/storage/fine-root necromass
f_labile_stem          = [0.05]  # [--] labile fraction of wood/CWD necromass
struct_lignin_frac     = [0.25]  # [--] lignin fraction of the structural-litter stream

[camac]
mort_rho_ref   = 0.6
mort_gamma_0   = 0.0094
mort_gamma_exp = -1.8392
mort_alpha_0   = 0.05
mort_alpha_exp = -1.1493
mort_beta_0    = 18.72
mort_beta_exp  = 0.2792

[allometry]
b1Ht       = 1.139963
b2Ht       = 0.564899
agb_c1     = 0.03365        # [kgC] Chave et al. (2014) eq. 4, 0.0673 / C2B (dry mass to carbon)
agb_c2     = 0.976          # Chave et al. (2014) eq. 4
ca_b1      = 0.370
ca_b2      = 0.464
lai_b1     = 0.23384770     # ED2 c14f15_bl_xx / C2B (= ED2 SLA*bleaf)
lai_b2     = 0.6410495
light_ext  = 0.5

# No [phenology] section: without it every PFT always flushes and never senesces, losing leaves to
# background turnover alone, which is what a single evergreen tropical PFT needs.
