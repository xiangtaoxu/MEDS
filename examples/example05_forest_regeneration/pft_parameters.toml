# SPDX-License-Identifier: Apache-2.0
# The three PFTs of example 05: early, mid and late successional trees at Barro Colorado Island.
#
# Their wood is example 03's: BCI's species split into three wood-density classes (thirds of the 1985
# basal area), with that example's census-fitted mortality and BCI height curve. Their leaves sit on
# the leaf economics spectrum, early to late from thin, short-lived, fast leaves to thick, long-lived,
# slow ones; example 04's calibrated BCI leaf is the spectrum's anchor, and everything else a canopy
# or a root does is example 04's. calibrate_growth.py fitted where the PFTs sit on the spectrum and
# the carbon costs below to example 03's growth law (calibration.json).
# Every per-PFT array has length 3 (the PFT count = length of [pft].wood_density).

[pft]
#----- Wood, size and recruitment (example 03). ----------------------------------------------------
wood_density       = [0.36, 0.50, 0.68]    # [g/cm3] early, mid, late: the BCI wood-density classes
dbh_critical       = [300.0, 300.0, 300.0] # [cm] unused by the carbon path: only height is capped
hgt_max            = [46.0, 46.0, 46.0]    # [m] the BCI height curve stays below it (43 m at 300 cm)
min_cohort_height  = 1.5                   # [m] recruits are born here: dbh 0.47 cm on the BCI height curve
recruit_carbon_efficiency = [1.0e-3, 1.0e-3, 1.0e-3]  # [--] reproduction carbon -> recruits
seed_rain_recruits = [0.3333, 0.3333, 0.3333]   # [plant/m2/yr] from outside, every patch: one sapling per m2
                                               # a year shared by the PFTs
include_pft        = [1, 1, 1]

#----- Leaf traits at the top of the canopy, from Panama's sun leaves: canopy-crane leaves at PNM and
#      Fort Sherman (Xu et al. 2017, Ecology Letters 20:1097, Appendix 3) and seedlings in gaps at the
#      Barro Colorado Nature Monument (Kitajima et al. 2013, Annals of Botany 112:685), where leaves
#      live from about 0.3 yr (light wood) to 0.4-2.4 yr (dense wood), and canopy sun leaves at the PNM
#      crane 0.2-0.9 yr (Kitajima et al. 1997, 2005). Leaves turn over at 1 / their lifespan; LMA is the
#      crane PFTs' 100-120 g/m2; Vcmax25 is example 04's calibrated BCI leaf for all three PFTs. SLA is
#      carbon-based: 2000 / LMA. Fine-root carbon equals leaf carbon (ED2's q = 1), and fine roots turn
#      over at 1.5 / the leaf lifespan, slower in the shade as the leaves are
#      ([trait_dynamics].fineroot_lifespan_plastic).
leaf_lifespan_toc  = [0.5, 0.7, 0.9]         # [yr]
sla                = [20.0, 18.18, 16.67]    # [m2/kgC] LMA 100, 110, 120 g/m2
vcmax25            = [31.3275, 31.3275, 31.3275]   # [umol/m2/s] example 04's calibrated leaf
root_to_leaf_ratio = [1.0, 1.0, 1.0]

#----- Stem maintenance respiration on sapwood volume alone (no surface term). The rate puts the 1985
#      census stand's aboveground stem respiration at the 4.2-5.1 MgC/ha/yr of stem CO2 efflux measured in
#      mature Amazon forests (Chambers et al. 2004; Malhi 2012; Cavaleri et al. 2006 at La Selva) on BCI's
#      weather. The coarse roots respire at the same rate on top (/aboveground_frac).
stem_resp_factor25  = [0.0, 0.0, 0.0]      # [umol CO2/m2 stem/s @25C]
stem_resp_sapwood25 = [31.25, 31.25, 31.25]   # [umol CO2/m3 sapwood/s @25C]

#----- Carbon costs (calibrate_growth.py). -------------------------------------------------------------
# Reproduction: about 0.5 MgC/ha/yr of flowers and fruit fall in BCI's litter traps, 9-10 % of the
# litterfall (Chave et al. 2010, Table 1, Leigh 1999's traps), 2-5 % of a tropical forest's NPP
# (Malhi et al. 2011: 5-15 % of canopy NPP).
reproduction_investment_fraction = [0.10, 0.10, 0.10]   # [--] growth fraction to reproduction ...
min_reproduction_height = 5.27             # [m] ... above this height (calibrate_growth.py)

#----- Sink limit on wood growth: a cohort's diameter grows at most max_absolute_growth_rate x dbh[cm]^0.5
#      a year, and the carbon it cannot use is exuded by the roots. The shape is BCI's census: the 75th
#      percentile of diameter growth rises as dbh^0.5 at a given light (a quantile regression ln g = a +
#      0.5 ln dbh + beta x overtopping LAI on each PFT's 1990-2010 growth of trees 1-30 cm; fitted per PFT
#      0.45, 0.65, 0.47). Its level is twice that quantile extrapolated to LAI 0 (0.211, 0.153, 0.059 cm/yr
#      at 1 cm), which lets saplings on open ground grow as fast as the census's best-lit ones.
max_absolute_growth_rate     = [0.422, 0.306, 0.118]   # [cm/yr] at dbh 1 cm
max_absolute_growth_exponent = [0.5, 0.5, 0.5]

#----- Wood area and sapwood allometry (ED2 ed_params.f90, tropical broadleaf). ---------------------
wai_b1             = [0.0096, 0.0096, 0.0096]
wai_b2             = [2.0947, 2.0947, 2.0947]
sapwood_area_b1    = [1.582, 1.582, 1.582]
sapwood_area_b2    = [1.764, 1.764, 1.764]
leaf_width         = [0.04, 0.04, 0.04]
branch_diameter    = [0.02, 0.02, 0.02]
crown_area_frac    = [1.0, 1.0, 1.0]

#----- Leaf photosynthesis and stomata: example 04's calibration (Vcmax25 is above). -------------------
photosynthetic_pathway = [1, 1, 1]
jmax_vcmax_ratio   = [1.6983, 1.6983, 1.6983]
tpu_vcmax_ratio    = [0.167, 0.167, 0.167]
rd_vcmax_ratio     = [0.015, 0.015, 0.015]
kp25               = [1.0e-9, 1.0e-9, 1.0e-9]
stomatal_g0        = [0.000463421, 0.000463421, 0.000463421]
stomatal_g1        = [2.82088, 2.82088, 2.82088]       # Medlyn [kPa^0.5]
stomatal_d0        = [1500.0, 1500.0, 1500.0]
quantum_yield_c4   = [0.0, 0.0, 0.0]
theta_j            = [0.70, 0.70, 0.70]
theta_cj_c3        = [0.98, 0.98, 0.98]
theta_ip_c3        = [0.95, 0.95, 0.95]
theta_cj_c4        = [0.80, 0.80, 0.80]
theta_ic_c4        = [0.95, 0.95, 0.95]
katul_lambda25     = [800.0, 800.0, 800.0]
wstress_psi_open   = [-0.5, -0.5, -0.5]
wstress_psi_close  = [-3.0, -3.0, -3.0]
wstress_lambda_exp = [1.0, 1.0, 1.0]
wstress_sref_stomata = [2.0, 2.0, 2.0]

#----- Other carbon traits (example 04). -----------------------------------------------------------
huber_value            = [1.5e-4, 1.5e-4, 1.5e-4]
aboveground_frac       = [0.7, 0.7, 0.7]
storage_cushion        = [1.0, 1.0, 1.0]
growth_resp_factor     = [0.3, 0.3, 0.3]
fineroot_turnover_rate = [3.0, 2.143, 1.667]  # [1/yr] 1.5 / leaf_lifespan_toc
wood_carbon_density    = [300.0, 300.0, 300.0]
f_labile_leaf          = [0.70, 0.70, 0.70]
f_labile_stem          = [0.05, 0.05, 0.05]
struct_lignin_frac     = [0.25, 0.25, 0.25]

#----- Maintenance respiration of fine roots (leaf Rd is rd_vcmax_ratio, stems above). ----------------
is_woody           = [1, 1, 1]
# The roots' autotrophic respiration, rhizosphere included: 5.8 MgC/ha/yr at Gigante (soil respiration
# 15.3, Sayer et al. 2007, of which roots 38 % by trenching, Sayer & Tanner 2010), 5.5 at Manaus
# (Chambers et al. 2004). 2.7 gives the census stand 5.6 with the coarse roots' share of stem
# respiration and the roots' growth respiration.
root_resp_factor25 = [2.7, 2.7, 2.7]     # [umol CO2/kgC fine root/s @25C]

#----- Canopy optics (example 04; leaf_angle_mean is its calibrated value). --------------------------
leaf_reflect_vis   = [0.10, 0.10, 0.10]
leaf_transmit_vis  = [0.05, 0.05, 0.05]
leaf_reflect_nir   = [0.45, 0.45, 0.45]
leaf_transmit_nir  = [0.25, 0.25, 0.25]
leaf_emissivity    = [0.97, 0.97, 0.97]
wood_reflect_vis   = [0.11, 0.11, 0.11]
wood_transmit_vis  = [0.001, 0.001, 0.001]
wood_reflect_nir   = [0.25, 0.25, 0.25]
wood_transmit_nir  = [0.001, 0.001, 0.001]
wood_emissivity    = [0.90, 0.90, 0.90]
leaf_clumping      = [0.80, 0.80, 0.80]
wood_clumping      = [0.50, 0.50, 0.50]
leaf_angle_mean    = [55.1153, 55.1153, 55.1153]   # [deg]
leaf_angle_std     = [20.0, 20.0, 20.0]

# Required by the loader; the [derived] table below sets the three PFTs' mortality instead.
[camac]
mort_rho_ref   = 0.6
mort_gamma_0   = 0.0094
mort_gamma_exp = -1.8392
mort_alpha_0   = 0.05
mort_alpha_exp = -1.1493
mort_beta_0    = 18.72
mort_beta_exp  = 0.2792

# Mortality m = mort_gamma + mort_alpha * exp(-mort_beta * g), g a cohort's dbh growth [cm/yr] over
# the last 90 days: example 03's fit to the BCI censuses (vital_rates.json), the same law on the same
# growth. Treefall (main config, 0.014/yr) kills the canopy trees in each new gap on top of this, and
# the census's gamma already counts those deaths, so 0.014 is taken off gamma.
# Read because the main config sets [options].override_derived = true.
[derived]
mort_gamma = [0.011182, 0.006528, 0.005908]   # [1/yr] census gamma 0.025182, 0.020528, 0.019908 - 0.014
mort_alpha = [0.247431, 0.086574, 0.152056]   # [1/yr]
mort_beta  = [15.0890, 19.3890, 58.7932]      # [yr/cm]

# Light plasticity, trait = top-of-canopy value x exp(k x overtopping LAI): Ma et al. (2025, JGR
# Biogeosciences) from BCI's crane, saplings against canopy leaves -- k_Vcmax = -(0.00242 Vcmax25 +
# 0.06212), k_Rd = -(0.18974 Rd25 + 0.11744) with Rd25 = 0.015 Vcmax25, k_SLA 0.199 -- and half of
# their k_LL 0.240: shade lengthens leaf life 1.5 times in Kitajima et al. (2013)'s seedling gardens and
# 2 times from canopy to understory in Xu et al. (2017), against 3.3 times at LAI 5 with 0.240.
kplastic_vcmax  = [-0.1379, -0.1379, -0.1379]
kplastic_rd     = [-0.2066, -0.2066, -0.2066]
kplastic_sla    = [0.199, 0.199, 0.199]
kplastic_llspan = [0.120, 0.120, 0.120]

# The Barro Colorado height curve (Cano et al. 2019, Biogeosciences 16:847, eq. 7), as in example 03;
# leaf area and biomass follow from the height.
[allometry]
b1Ht       = 1.139963
b2Ht       = 0.564899
agb_c1     = 0.03365        # [kgC] Chave et al. (2014) eq. 4, 0.0673 / C2B (dry mass to carbon)
agb_c2     = 0.976          # Chave et al. (2014) eq. 4
ca_b1      = 0.370
ca_b2      = 0.464
lai_b1     = 0.23384770     # ED2 c14f15_bl_xx / C2B (= ED2 SLA*bleaf)
lai_b2     = 0.6410495
light_ext  = 0.5
height_allometry = "gmm"
gmm_a      = 58.0           # [m] asymptotic height
gmm_b      = 0.73           # [--] exponent on dbh
gmm_k      = 21.8           # [cm^gmm_b] half-saturation

# No [phenology] section: every PFT is evergreen, losing leaves to background turnover alone.
