# MEDS PFT configuration -- all PFT-specific parameters, plus the allometry and mortality-hazard
# (Camac) coefficients (shared for now; PFT-specific later). Named by [init].pft_config in the
# main config. EVERY key is REQUIRED; a missing key is a hard error.
#
# The number of PFTs is the length of [pft].wood_density; every per-PFT array must match it.

[pft]
wood_density       = [0.40, 0.60, 0.85]    # [g/cm3] the growth-mortality trade-off axis (pioneer/mid/climax)
dbh_critical       = [100.0, 100.0, 100.0] # [cm] maximum diameter
hgt_max            = [46.0, 46.0, 46.0]     # [m] per-PFT asymptotic max height (allometry cap)
reproduction_investment_fraction = [0.3, 0.3, 0.3]      # [--] growth fraction diverted to reproduction
repro_carbon_efficiency          = [1.0e-3, 1.0e-3, 1.0e-3] # [--] reproduction carbon -> establishable recruits
seed_rain_recruits = [0.01, 0.01, 0.01]    # [plant/m2/yr] baseline external seed rain
include_pft        = [1, 1, 1]             # 1 = PFT may recruit, 0 = excluded
min_cohort_height       = 2.0              # [m] smallest tracked cohort; recruits born here (all PFTs)
min_reproduction_height = 20.0             # [m] height a cohort must exceed before it reproduces (all PFTs)
# Leaf photosynthesis / stomatal traits (FvCB C3 + Collatz C4). pathway: 1 = C3, 2 = C4.
# (Used by the leaf gas-exchange model; not yet coupled to demographic growth.)
photosynthetic_pathway = [1, 1, 2]                  # pioneer C3, climax C3, a C4 grass
vcmax25            = [60.0, 45.0, 40.0]             # [umol/m2/s] max carboxylation at 25 degC
jmax_vcmax_ratio   = [1.8, 1.7, 4.0]                # [--] Jmax25/Vcmax25 (C4 ratio high; J unused for C4)
tpu_vcmax_ratio    = [0.167, 0.167, 0.167]          # [--] TPU25/Vcmax25 (C3 product limit)
rd_vcmax_ratio     = [0.015, 0.015, 0.025]          # [--] Rd25/Vcmax25 (leaf respiration)
kp25               = [1.0e-9, 1.0e-9, 0.7]          # [mol/m2/s] C4 PEPcase slope (>0; ~unused for C3)
stomatal_g0        = [0.01, 0.01, 0.04]             # [mol/m2/s] cuticular/residual conductance
stomatal_g1        = [4.0, 3.0, 1.6]                # Medlyn [kPa^0.5] (Leuning would use ~8-12)
stomatal_d0        = [1500.0, 1500.0, 1500.0]       # [Pa] Leuning humidity sensitivity
quantum_yield_c4   = [0.0, 0.0, 0.04]               # [mol CO2/mol photon] C4 light slope (0 for C3)
theta_j            = [0.70, 0.70, 0.85]             # [--] curvature of the J hyperbola ONLY (C3 co-limitation is theta_*_c3;
                                                    #   C4 does not use it). 0.7, as CLM5 and ED2: every leaf of a cohort
                                                    #   gets the cohort's mean light, and averaging a leaf's curve over the
                                                    #   light its leaves really see bends it more than one leaf's (a leaf's
                                                    #   own value moves with its light and CO2: 0.6-0.95, Ogren & Evans
                                                    #   1993). Revisit with sunlit/shaded leaves (#343)
theta_cj_c3        = [0.98, 0.98, 0.98]            # [--] C3 Ac/Aj co-limitation curvature (#118; NOT theta_j)
theta_ip_c3        = [0.95, 0.95, 0.95]            # [--] C3 (Ac,Aj)/Ap co-limitation curvature (#118)
theta_cj_c4        = [0.80, 0.80, 0.80]             # [--] C4 co-limitation curvature 1 (C4 only)
theta_ic_c4        = [0.95, 0.95, 0.95]             # [--] C4 co-limitation curvature 2 (C4 only)
katul_lambda25     = [600.0, 800.0, 350.0]          # [umol CO2/mol H2O] Katul marginal water-use efficiency
wstress_psi_open   = [-0.5, -0.5, -0.5]             # [MPa] leaf potential at which beta = 1 (no stress)
wstress_psi_close  = [-2.5, -3.0, -2.0]             # [MPa] leaf potential at which beta = 0 (full stress)
wstress_lambda_exp = [1.0, 1.0, 1.0]                # [--] Katul lambda water-stress exponent
wstress_sref_stomata = [2.0, 2.0, 2.0]              # [1/MPa] Sabot stomatal-stress sensitivity (beta_stomata=exp(sref*(psi-psi_onset)))
# stomata_psi_onset = [-0.857, -0.857, -0.857]      # [MPa] OPTIONAL predawn leaf potential where the stomatal stress begins
                                                    #   (beta_stomata = 1 above it). Absent: half the PFT's leaf turgor-loss
                                                    #   point, the recommended value (-0.857 at the [hydraulics] leaf_pi0 and
                                                    #   leaf_elastic_mod). It clears the gravity head of a tree up to ~85 m in wet soil.
# leaf_surf_water_max = [0.1, 0.1, 0.1]             # [kg/m2 leaf] OPTIONAL film capacity of a leaf (intercepted rain and dew)
# wood_surf_water_max = [0.1, 0.1, 0.1]             # [kg/m2 wood] OPTIONAL film capacity of the woody surface. Absent: 0.1 each,
                                                    #   CLM5's dewmx. Used with [fast].canopy_water_on; a cohort holds
                                                    #   leaf_surf_water_max*LAI + wood_surf_water_max*WAI before it drips.
# Carbon-dynamics traits (meds_plant_carbon_dynamics). All state is CARBON; conversions folded in here.
# Consumed once the carbon-allocation engine is wired; size2leaf_carbon/size2wood_carbon use sla/aboveground_frac.
sla                    = [16.0, 13.0, 10.0]         # [m2/kgC] specific leaf area (pioneer high -> climax low)

#----- WOOD AREA INDEX allometry: wai = nplant * wai_b1 * dbh**wai_b2  (ED2 b1WAI/b2WAI, broadleaf).
#      Replaces the old wai = 0.20*lai placeholder, which tied wood AREA to LEAF area. WAI feeds the
#      wood boundary layer, the wood longwave emission area, the wood sensible-heat coefficient and
#      -- through cap/area -- the wood thermal timescale, so the placeholder mis-scaled all four.
wai_b1                 = [0.0096, 0.0096, 0.0096]   # [--] ED2 b1WAI = 0.0192*0.5, broadleaf
wai_b2                 = [2.0947, 2.0947, 2.0947]   # [--] ED2 b2WAI, broadleaf

#----- SAPWOOD-AREA allometry: sapwood_area = sapwood_area_b1 * dbh**sapwood_area_b2 [cm2], and the
#      sapwood FRACTION of basal area (capped at 1) sets bsap. Replaces bsap = 0.10*wood_carbon.
#      Also used as the proxy for thermally-active wood -- see meds_allometry%sapwood_fraction.
sapwood_area_b1        = [1.582, 1.582, 1.582]      # [cm2/cm^b2] ED2 b1SA, tropical broadleaf
sapwood_area_b2        = [1.764, 1.764, 1.764]      # [--]        ED2 b2SA, tropical broadleaf

#----- Canopy-element geometry for the aerodynamic boundary layers. These were hard-coded
#      constants in the fast loop (0.04 m, 0.02 m, 1.0); the values below reproduce them.
leaf_width         = [0.04, 0.04, 0.04]     # [m]  characteristic leaf width
branch_diameter    = [0.02, 0.02, 0.02]     # [m]  characteristic branch diameter
crown_area_frac    = [1.0, 1.0, 1.0]      # [--] crown area as a fraction of the patch
root_to_leaf_ratio     = [1.0, 1.0, 1.0]            # [--] fine-root:leaf target ratio (ED2 q)
huber_value            = [1.0e-4, 1.5e-4, 2.0e-4]   # [m2 sap/m2 leaf] sapwood-area:leaf-area (sapwood + hydraulics)
aboveground_frac       = [0.7, 0.7, 0.7]            # [--] aboveground fraction of woody carbon (ED2 agf_bs)

#----- Non-leaf MAINTENANCE respiration (per-PFT; leaf Rd is rd_vcmax_ratio above). These were
#      three run-uniform literals in the fast driver, so every PFT respired stem and root alike.
is_woody           = [1, 1, 1]     # 1 = woody (0 = grass: no stem respiration)
stem_resp_factor25 = [0.06, 0.06, 0.06]  # [umol CO2/m2 stem/s @25C]
root_resp_factor25 = [0.30, 0.30, 0.30]  # [umol CO2/kgC fine root/s @25C]

#----- CANOPY OPTICS (the two-stream's per-PFT table). Shortwave as reflectance + transmittance
#      per band; LONGWAVE as EMISSIVITY, because that is the number anyone has for a leaf -- the
#      band's reflectance is 1 - emissivity and its transmittance is 0 (a leaf is opaque at
#      thermal wavelengths). Validated at load: reflect + transmit is the single-scatter albedo
#      and must stay BELOW 1, or a scattering layer conserves or creates energy.
leaf_reflect_vis   = [0.10, 0.10, 0.10]   # [--] leaf VIS reflectance
leaf_transmit_vis  = [0.05, 0.05, 0.05]   # [--] leaf VIS transmittance
leaf_reflect_nir   = [0.45, 0.45, 0.45]   # [--] leaf NIR reflectance
leaf_transmit_nir  = [0.25, 0.25, 0.25]   # [--] leaf NIR transmittance
leaf_emissivity    = [0.97, 0.97, 0.97]    # [--] leaf thermal emissivity
wood_reflect_vis   = [0.11, 0.11, 0.11]   # [--] wood/bark VIS reflectance
wood_transmit_vis  = [0.001, 0.001, 0.001]   # [--] wood/bark VIS transmittance (near-opaque)
wood_reflect_nir   = [0.25, 0.25, 0.25]   # [--] wood/bark NIR reflectance
wood_transmit_nir  = [0.001, 0.001, 0.001]   # [--] wood/bark NIR transmittance
wood_emissivity    = [0.90, 0.90, 0.90]    # [--] wood thermal emissivity
leaf_clumping      = [0.80, 0.80, 0.80]    # [--] leaf clumping factor in (0,1]
wood_clumping      = [0.50, 0.50, 0.50]    # [--] wood clumping factor in (0,1]
leaf_angle_mean    = [45.0, 45.0, 45.0]   # [deg] mean leaf inclination (spherical: mean 57.3, std 21.6)
leaf_angle_std     = [20.0, 20.0, 20.0]   # [deg] its standard deviation
storage_cushion        = [1.0, 1.0, 1.0]            # [--] storage target as a multiple of the leaf target
growth_resp_factor     = [0.3, 0.3, 0.3]            # [--] construction cost (fraction of metabolic NPP)
# OPTIONAL carbon traits; absent, each is 0 for every PFT.
# storage_turnover_rate = [0.0, 0.0, 0.0]          # [1/yr] maintenance loss of the storage pool
# retained_carbon_fraction = [0.0, 0.0, 0.0]       # [--] shed leaf carbon kept (resorbed) rather than littered
leaf_lifespan_toc      = [1.0, 2.0, 3.0303]         # [yr] top-of-canopy leaf lifespan (baseline turnover = 1/llspan)
fineroot_turnover_rate = [1.0, 0.8, 0.6]            # [1/yr] baseline fine-root turnover
wood_carbon_density    = [200.0, 300.0, 425.0]      # [kgC/m3] wood carbon density (Huber sapwood carbon)
# Necromass -> litter-destination split (meds_column_state_types%necromass_to_litter). aboveground_frac
# (above) doubles as the litter above/below-ground split for leaf/storage and wood streams.
f_labile_leaf          = [0.80, 0.70, 0.60]         # [--] labile fraction of leaf/storage/fine-root necromass
f_labile_stem          = [0.05, 0.05, 0.05]         # [--] labile fraction of wood/CWD necromass
struct_lignin_frac     = [0.20, 0.25, 0.30]         # [--] lignin fraction of the structural-litter stream
# OPTIONAL per-PFT plant hydraulics. Each overrides the [hydraulics] value of the main file for the
# PFTs it lists, so one trait can be made per-PFT without restating the others; absent, every PFT
# takes the [hydraulics] value (shown here).
# leaf_pi0           = [-1.5, -1.5, -1.5]          # [MPa] leaf osmotic potential at full turgor
# leaf_elastic_mod   = [12.0, 12.0, 12.0]          # [MPa] leaf bulk elastic modulus
# leaf_apoplast_frac = [0.30, 0.30, 0.30]          # [--]  leaf apoplastic fraction
# leaf_water_sat     = [2.0, 2.0, 2.0]             # [kg H2O/kgC] leaf saturated water content
# wood_pi0           = [-1.0, -1.0, -1.0]          # [MPa] wood osmotic potential at full turgor
# wood_elastic_mod   = [8.0, 8.0, 8.0]             # [MPa] wood bulk elastic modulus
# wood_apoplast_frac = [0.20, 0.20, 0.20]          # [--]  wood apoplastic fraction
# wood_water_sat     = [1.0, 1.0, 1.0]             # [kg H2O/kgC] wood saturated water content
# wood_psi50         = [-2.0, -2.0, -2.0]          # [MPa] xylem potential at 50 % loss of conductance
# wood_kexp          = [2.0, 2.0, 2.0]             # [--]  vulnerability-curve shape
# k_plant_max        = [6.0e-4, 6.0e-4, 6.0e-4]    # [kg/s/MPa/m2 leaf] whole-plant conductance
# wood_kmax          = [8.0, 8.0, 8.0]             # [kg/m/s/MPa] sapwood specific conductivity
# vessel_curl        = [1.5, 1.5, 1.5]             # [--]  path-length factor

[camac]
# Mortality hazard = mort_gamma + mort_alpha*exp(-mort_beta*growth_avg). Each parameter is a power
# law in wood density: param = param_0 * (rho/mort_rho_ref)^exp (always positive).
mort_rho_ref   = 0.6        # [g/cm3] wood-density reference
mort_gamma_0   = 0.0094     # baseline (growth-independent) hazard scale [1/yr]
mort_gamma_exp = -1.8392    # baseline hazard exponent on (rho/ref)
mort_alpha_0   = 0.05       # low-growth hazard scale [1/yr]
mort_alpha_exp = -1.1493    # low-growth hazard exponent
mort_beta_0    = 18.72      # growth-sensitivity scale [yr/cm]
mort_beta_exp  = 0.2792     # growth-sensitivity exponent

[allometry]
# Pan-tropical (ED2 iallom==3) size allometry. height = exp(b1Ht + b2Ht*ln dbh) capped at the
# per-PFT [pft].hgt_max; agb = agb_c1 * rho^agb_c2 * (dbh^2*h)^agb_c2; leaf_area = lai_b1 * (dbh^2*h)^lai_b2;
# crown area = ca_b1 * (dbh^2*h)^ca_b2; light = exp(-light_ext * overtopping_LAI).
b1Ht       = 1.139963
b2Ht       = 0.564899
agb_c1     = 0.03365        # [kgC] AGB scale: Chave et al. (2014) eq. 4, 0.0673 / C2B (dry mass to carbon)
agb_c2     = 0.976          # AGB exponent on rho and on dbh^2*h: Chave et al. (2014) eq. 4
ca_b1      = 0.370          # crown-area scale
ca_b2      = 0.464          # crown-area exponent
lai_b1     = 0.23384770     # per-stem leaf-area scale: ED2 c14f15_bl_xx / C2B (= ED2 SLA*bleaf)
lai_b2     = 0.6410495      # per-stem leaf-area exponent
light_ext  = 0.5            # Beer-Lambert extinction through overtopping LAI

# [derived] -- only consulted when [options].override_derived = true in the main config. Pins the
# mortality-hazard parameters instead of deriving them from wood density:
# [derived]
# mort_gamma = [...]   # length = number of PFTs
# mort_alpha = [...]
# mort_beta  = [...]

# ------------------------------------------------------------------------------------------
# Leaf-phenology cue parameters (per PFT; docs/science/plant_phenology.md). The gate is the
# PRESENCE of this [phenology] section in THIS file: absent, every PFT keeps the built-in defaults,
# both masks 0 -- always flushing, never senescing, losing leaves to background turnover alone.
# Present, every key below is REQUIRED except the optional ones marked; every array length must
# equal the number of PFTs. Leaf habit (deciduous, semi-deciduous, evergreen) comes from these
# parameters: a deciduous PFT senesces to min_leaf_cover = 0, an evergreen one stops above 0.
#
# Four cues, chosen independently for each side by a bit mask: 1 = TEMP, 2 = DAYLENGTH,
# 4 = WATER, 8 = PAR.
#   TEMP     : warmth above flush_base_temp summed from midwinter; cold below shed_base_temp
#              summed from midsummer.
#   DAYLENGTH: the photoperiod [h].
#   WATER    : predawn leaf water potential summed above and below the PFT's turgor-loss point
#              [MPa day]; each sum restarts when the other side's switch crosses 0.5.
#   PAR      : the running mean of the daily PAR reaching the cohort's top [umol/m2/s], so each
#              cohort sees its own place in the canopy.
# Every switch is sigma(s (x - x*)): a centre x* and a signed sharpness s; it rises from 0.12 to
# 0.88 over x* +- 2/|s|, and s < 0 turns it on as x falls. The flush signal is the PRODUCT of the
# flush cues' switches; the shed signal is the larger of the seasonal trigger (the product of the
# TEMP, DAYLENGTH and PAR switches) and the WATER switch. A mask of 0 always flushes / never
# senesces.
#
# Example below: PFT 1 a temperate deciduous tree (TEMP and DAYLENGTH on both sides), PFTs 2 and
# 3 always flushing and never senescing.
# [phenology]
# flush_cue_mask        = [3, 0, 0]                # [bitmask] cues of the flush side
# shed_cue_mask         = [3, 0, 0]                # [bitmask] cues of the shed side
# flush_cue_timescale   = [5.0, 5.0, 5.0]          # [day]   smoothing of the flush tendency
# shed_cue_timescale    = [5.0, 5.0, 5.0]          # [day]   smoothing of the shed tendency
# flush_rate_max        = [0.06667, 0.06667, 0.06667] # [1/day] leaf growth at full flush tendency
# shed_rate_max         = [0.05, 0.05, 0.05]       # [1/day] senescence at full shed tendency
# min_leaf_cover        = [0.0, 0.0, 0.0]          # [--]    leaf cover senescence stops at
# bare_leaf_cover       = [0.02, 0.02, 0.02]       # [--]    a dormant canopy below this goes bare
# flush_base_temp       = [278.15, 278.15, 278.15] # [K]     warmth base
# flush_degree_days     = [100.0, 100.0, 100.0]    # [K day] warmth requirement
# flush_temp_sharpness  = [0.04, 0.04, 0.04]       # [1/(K day)]
# shed_base_temp        = [290.15, 290.15, 290.15] # [K]     cold base
# shed_degree_days      = [50.0, 50.0, 50.0]       # [K day] cold requirement after midsummer
# shed_temp_sharpness   = [0.1, 0.1, 0.1]          # [1/(K day)]
# flush_daylength_threshold = [12.0, 12.0, 12.0]   # [h]
# flush_daylength_sharpness = [1.0, 1.0, 1.0]      # [1/h]   a flush gate fits as a step (~8)
# shed_daylength_threshold  = [11.0, 11.0, 11.0]   # [h]
# shed_daylength_sharpness  = [-1.0, -1.0, -1.0]   # [1/h]   < 0: short days trigger senescence
#
# OPTIONAL: the PAR and WATER cues; absent keys keep the defaults shown.
# flush_par_threshold   = [300.0, 300.0, 300.0]    # [umol/m2/s]
# flush_par_sharpness   = [0.02, 0.02, 0.02]       # [m2 s/umol] > 0: bright light permits flushing
# shed_par_threshold    = [300.0, 300.0, 300.0]    # [umol/m2/s]
# shed_par_sharpness    = [0.02, 0.02, 0.02]       # [m2 s/umol] > 0: bright light triggers senescence
# par_window            = [10.0, 10.0, 10.0]       # [day]   PAR running-mean window
# flush_water_sum       = [10.0, 10.0, 10.0]       # [MPa day] wet sum that permits flushing
# flush_water_sharpness = [0.5, 0.5, 0.5]          # [1/(MPa day)]
# shed_water_sum        = [10.0, 10.0, 10.0]       # [MPa day] dry sum that triggers shedding
# shed_water_sharpness  = [0.5, 0.5, 0.5]          # [1/(MPa day)]
