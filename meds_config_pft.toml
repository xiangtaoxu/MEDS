# MEDS PFT configuration -- all PFT-specific parameters, plus the allometry and mortality-hazard
# (Camac) coefficients (shared for now; PFT-specific later). Named by [init].pft_config in the
# main config. EVERY key is REQUIRED; a missing key is a hard error.
#
# The number of PFTs is the length of [pft].wood_density; every per-PFT array must match it.

[pft]
wood_density       = [0.40, 0.60, 0.85]    # [g/cm3] the growth-mortality trade-off axis (pioneer/mid/climax)
dbh_critical       = [100.0, 100.0, 100.0] # [cm] maximum diameter
hgt_max            = [46.0, 46.0, 46.0]     # [m] per-PFT asymptotic max height (allometry cap)
# Intrinsic growth: a capped log-linear function of dbh (max rate falls pioneer -> climax).
growth_dbh_slope   = [0.25, 0.25, 0.25]    # [--]    ln-growth slope vs (ln cap - ln dbh)
growth_dbh_cap     = [100.0, 100.0, 100.0] # [cm]    dbh above which intrinsic growth floors
growth_dbh_max     = [1.5, 1.0, 0.5]       # [cm/yr] intrinsic growth at/above the cap
growth_lai_slope   = [-0.8, -0.7, -0.6]    # [(m2/m2)^-1] competition suppression (less neg = more shade-tolerant)
reproduction_investment_fraction = [0.3, 0.3, 0.3]      # [--] growth fraction diverted to reproduction
repro_carbon_efficiency          = [1.0e-3, 1.0e-3, 1.0e-3] # [--] reproduction carbon -> establishable recruits
seed_rain_recruits = [0.01, 0.01, 0.01]    # [plant/m2/yr] baseline external seed rain
include_pft        = [1, 1, 1]             # 1 = PFT may recruit, 0 = excluded
min_cohort_height       = 2.0              # [m] smallest tracked cohort; recruits born here (all PFTs)
min_reproduction_height = 20.0             # [m] height a cohort must exceed before it reproduces (all PFTs)
# Leaf photosynthesis / stomatal traits (FvCB C3 + Collatz C4). pathway: 1 = C3, 2 = C4.
# (Used by the leaf gas-exchange model; not yet coupled to demographic growth.)
photosynthetic_pathway = [1, 1, 2]                  # pioneer C3, climax C3, a C4 grass
vcmax25            = [60.0, 45.0, 40.0]             # [umol/m2/s] max carboxylation at 25 degC
jmax_vcmax_ratio   = [1.8, 1.7, 4.0]                # [--] Jmax25/Vcmax25 (C4 ratio high; J unused for C4)
tpu_vcmax_ratio    = [0.167, 0.167, 0.167]          # [--] TPU25/Vcmax25 (C3 product limit)
rd_vcmax_ratio     = [0.015, 0.015, 0.025]          # [--] Rd25/Vcmax25 (leaf respiration)
kp25               = [1.0e-9, 1.0e-9, 0.7]          # [mol/m2/s] C4 PEPcase slope (>0; ~unused for C3)
stomatal_g0        = [0.01, 0.01, 0.04]             # [mol/m2/s] cuticular/residual conductance
stomatal_g1        = [4.0, 3.0, 1.6]                # Medlyn [kPa^0.5] (Leuning would use ~8-12)
stomatal_d0        = [1500.0, 1500.0, 1500.0]       # [Pa] Leuning humidity sensitivity
quantum_yield_c4   = [0.0, 0.0, 0.04]               # [mol CO2/mol photon] C4 light slope (0 for C3)
theta_j            = [0.85, 0.90, 0.85]             # [--] curvature: J hyperbola + C3 co-limitation
theta_cj_c4        = [0.80, 0.80, 0.80]             # [--] C4 co-limitation curvature 1 (C4 only)
theta_ic_c4        = [0.95, 0.95, 0.95]             # [--] C4 co-limitation curvature 2 (C4 only)
katul_lambda25     = [600.0, 800.0, 350.0]          # [umol CO2/mol H2O] Katul marginal water-use efficiency
wstress_psi_open   = [-0.5, -0.5, -0.5]             # [MPa] leaf potential at which beta = 1 (no stress)
wstress_psi_close  = [-2.5, -3.0, -2.0]             # [MPa] leaf potential at which beta = 0 (full stress)
wstress_lambda_exp = [1.0, 1.0, 1.0]                # [--] Katul lambda water-stress exponent
wstress_sref_stomata = [2.0, 2.0, 2.0]              # [1/MPa] Sabot stomatal-stress sensitivity (beta_stomata=exp(sref*psi_soil))
# Carbon-dynamics traits (meds_plant_carbon_dynamics). All state is CARBON; conversions folded in here.
# Consumed once the carbon-allocation engine is wired; size2leaf_carbon/size2wood_carbon use sla/aboveground_frac.
sla                    = [16.0, 13.0, 10.0]         # [m2/kgC] specific leaf area (pioneer high -> climax low)

#----- WOOD AREA INDEX allometry: wai = nplant * wai_b1 * dbh**wai_b2  (ED2 b1WAI/b2WAI, broadleaf).
#      Replaces the old wai = 0.20*lai placeholder, which tied wood AREA to LEAF area. WAI feeds the
#      wood boundary layer, the wood longwave emission area, the wood sensible-heat coefficient and
#      -- through cap/area -- the wood thermal timescale, so the placeholder mis-scaled all four.
wai_b1                 = [0.0192, 0.0192, 0.0192]   # [--] ED2 b1WAI, broadleaf
wai_b2                 = [2.0947, 2.0947, 2.0947]   # [--] ED2 b2WAI, broadleaf

#----- SAPWOOD-AREA allometry: sapwood_area = sapwood_area_b1 * dbh**sapwood_area_b2 [cm2], and the
#      sapwood FRACTION of basal area (capped at 1) sets bsap. Replaces bsap = 0.10*wood_carbon.
#      Also used as the proxy for thermally-active wood -- see meds_allometry%sapwood_fraction.
sapwood_area_b1        = [0.128, 0.128, 0.128]      # [cm2/cm^b2] ED2 b1SA
sapwood_area_b2        = [1.890, 1.890, 1.890]      # [--]        ED2 b2SA
root_to_leaf_ratio     = [1.0, 1.0, 1.0]            # [--] fine-root:leaf target ratio (ED2 q)
huber_value            = [1.0e-4, 1.5e-4, 2.0e-4]   # [m2 sap/m2 leaf] sapwood-area:leaf-area (sapwood + hydraulics)
aboveground_frac       = [0.7, 0.7, 0.7]            # [--] aboveground fraction of woody carbon (ED2 agf_bs)
storage_cushion        = [1.0, 1.0, 1.0]            # [--] storage target as a multiple of the leaf target
growth_resp_factor     = [0.3, 0.3, 0.3]            # [--] construction cost (fraction of metabolic NPP)
leaf_lifespan_toc      = [1.0, 2.0, 3.0303]         # [yr] top-of-canopy leaf lifespan (baseline turnover = 1/llspan)
fineroot_turnover_rate = [1.0, 0.8, 0.6]            # [1/yr] baseline fine-root turnover
wood_carbon_density    = [200.0, 300.0, 425.0]      # [kgC/m3] wood carbon density (Huber sapwood carbon)
evergreen              = [1, 1, 1]                  # 1 = evergreen (cold-suppress turnover), 0 = deciduous
# Necromass -> litter-destination split (meds_column_state_types%necromass_to_litter). aboveground_frac
# (above) doubles as the litter above/below-ground split for leaf/storage and wood streams.
f_labile_leaf          = [0.80, 0.70, 0.60]         # [--] labile fraction of leaf/storage/fine-root necromass
f_labile_stem          = [0.05, 0.05, 0.05]         # [--] labile fraction of wood/CWD necromass
struct_lignin_frac     = [0.20, 0.25, 0.30]         # [--] lignin fraction of the structural-litter stream

[camac]
# Mortality hazard = mort_gamma + mort_alpha*exp(-mort_beta*growth_avg). Each parameter is a power
# law in wood density: param = param_0 * (rho/mort_rho_ref)^exp (always positive).
mort_rho_ref   = 0.6        # [g/cm3] wood-density reference
mort_gamma_0   = 0.0094     # baseline (growth-independent) hazard scale [1/yr]
mort_gamma_exp = -1.8392    # baseline hazard exponent on (rho/ref)
mort_alpha_0   = 0.05       # low-growth hazard scale [1/yr]
mort_alpha_exp = -1.1493    # low-growth hazard exponent
mort_beta_0    = 18.72      # growth-sensitivity scale [yr/cm]
mort_beta_exp  = 0.2792     # growth-sensitivity exponent

[allometry]
# Pan-tropical (ED2 iallom==3) size allometry. height = exp(b1Ht + b2Ht*ln dbh) capped at the
# per-PFT [pft].hgt_max; agb = agb_c1 * rho^agb_c2 * (dbh^2*h)^agb_c2; leaf_area = lai_b1 * (dbh^2*h)^lai_b2;
# crown_area = ca_b1 * (dbh^2*h)^ca_b2; light = exp(-light_ext * overtopping_LAI).
b1Ht       = 1.139963
b2Ht       = 0.564899
agb_c1     = 0.06080334     # [kgC] AGB scale (Chave-2014)
agb_c2     = 1.0044785      # AGB exponent on rho and on dbh^2*h
ca_b1      = 0.370          # crown-area scale
ca_b2      = 0.464          # crown-area exponent
lai_b1     = 0.46769540     # per-stem leaf-area scale (= ED2 SLA*bleaf)
lai_b2     = 0.6410495      # per-stem leaf-area exponent
light_ext  = 0.5            # Beer-Lambert extinction through overtopping LAI

# [derived] -- only consulted when [options].override_derived = true in the main config. Pins the
# mortality-hazard parameters instead of deriving them from wood density:
# [derived]
# mort_gamma = [...]   # length = number of PFTs
# mort_alpha = [...]
# mort_beta  = [...]

# ------------------------------------------------------------------------------------------
# Leaf-phenology cue parameters (per PFT). REQUIRED only when [phenology].phenology_on = true in the
# MAIN config; otherwise these are unused (the driver keeps its built-in literature defaults). Every
# array length must equal the number of PFTs. cue_mask is the OR of the cue bits:
#   0 = evergreen (always ON) | 1 = TEMP (GDD/chilling cold-deciduous) | 8 = PHOTO (daylength gate on TEMP)
#   (WATER = 2 and HYDRO = 4 are reserved -- their drivers are not yet wired; rejected in v1.)
# Example below: PFT 1 cold-deciduous, PFTs 2 & 3 evergreen.
# [phenology]
# cue_mask            = [1, 0, 0]                  # [bitmask] per-PFT cue selection
# cue_sharpness       = [2.0, 2.0, 2.0]            # [--]   logistic slope (larger = sharper threshold)
# on_threshold        = [0.6, 0.6, 0.6]            # favorability above which status = ON
# off_threshold       = [0.4, 0.4, 0.4]            # below which = OFF (in between = DORMANT deadband)
# gdd_base_temp       = [278.15, 278.15, 278.15]   # [K]     GDD accumulation base (5 degC)
# chill_base_temp     = [278.15, 278.15, 278.15]   # [K]     chilling-day base
# phen_a              = [-68.0, -68.0, -68.0]      # [K day] GDD-threshold intercept (Botta 2000)
# phen_b              = [638.0, 638.0, 638.0]      # [K day] GDD-threshold amplitude
# phen_c              = [-0.01, -0.01, -0.01]      # [1/day] chilling exponent (more chill -> less GDD needed)
# cold_drop_daylength = [10.9, 10.9, 10.9]         # [h]     autumn short-day drop trigger (White 1997)
# cold_drop_soiltemp1 = [284.3, 284.3, 284.3]      # [K]     cool-soil drop (with short days)
# cold_drop_soiltemp2 = [275.15, 275.15, 275.15]   # [K]     very-cold-soil drop (unconditional)
# photo_crit          = [11.0, 11.0, 11.0]         # [h]     critical daylength (CUE_PHOTO)
# photo_slope         = [2.0, 2.0, 2.0]            # [1/h]   daylength logistic slope (CUE_PHOTO)
