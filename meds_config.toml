# MEDS run configuration. Every key is optional: anything omitted keeps its built-in
# default. Read by meds_main (src/io/meds_config_io.f90). Sections group related
# parameters; values are scalars or [arrays].

[run]
timestep   = "daily"           # "daily" | "weekly" | "monthly"
# The run is bounded by two calendar dates (real Gregorian dates, leap years included).
# Format: "YYYY-MM-DD" or "YYYY-MM-DD HH:MM:SS". end_time is exclusive.
start_time = "2000-01-01"      # first simulated date
end_time   = "2250-01-01"      # stop date (250-year spin-up)

[init]
# init_mode selects where the initial community comes from; the file for the OTHER mode is kept
# here but ignored.  0 = near-bare ground, 1 = cohort census, 2 = restart from a state file.
init_mode    = 0
# census_file: a cohort CSV (site_id,patch_id,cohort_id,dbh,height,pft,nplant; dbh drives the
#              allometry) -- used only when init_mode = 1.
census_file  = "examples/census_example.csv"
# restart_file: a MEDS state checkpoint (<prefix>-S-<YYYYMMDDHHMMSS>.nc, the timestamp being
#               the simulated date it was written) -- used only when init_mode = 2. On restart
#               the run resumes from that date and continues to end_time.
restart_file = "meds_output-S-22500101000000.nc"

[demography]
demography_on          = true   # if false, structure is frozen (growth/mortality only)
do_cohort_fissfuse     = true   # monthly cohort recruitment + fusion/fission
do_patch_disturbance   = true   # annual treefall-gap creation
do_patch_fissfuse      = true   # annual patch fusion/termination
max_cohort             = 60     # per-patch cohort-count target (fusion relaxes to hit it)
cohort_lai_cap         = 1.0    # [m2/m2] single-cohort LAI cap (split above; fusion blocked above)
min_cohort_agb         = 1.0e-6 # [kgC/m2] cull cohorts below nplant*agb
max_patch              = 12     # patch-count target
patch_light_tol        = 0.10   # mean light-profile distance to fuse two patches
patch_light_maxdev_factor = 1.5 # max single-layer deviation multiplier
conservation_tol       = 0.001  # 0.1% AGB/area conservation tolerance
growth_memory_days     = 90.0   # [day] window of the running-mean growth that drives mortality

[disturbance]
patch_disturbance_rate     = 0.014  # [1/yr] fraction of area disturbed into a new age-0 gap
disturbance_survive_height = 10.0   # [m] tall (>=) cohorts die in the gap; short understory survives

[recruitment]
min_recruit_size        = 1.0e-2    # [plant/m2] pool threshold to spawn a recruit cohort
min_cohort_height       = 2.0       # [m] smallest tracked cohort; recruits are born here (all PFTs)
min_reproduction_height = 20.0      # [m] height a cohort must exceed before it reproduces (all PFTs)
# seed_rain_recruits    = 0.01      # [plant/m2/yr] baseline seed rain, scalar for all PFTs (or [pft] below)

[pft]
# Per-PFT trait arrays (length = number of PFTs, default 3: pioneer / mid / climax).
# Changing wood_density automatically re-derives the mortality hazard (mort_gamma/alpha/beta).
wood_density       = [0.40, 0.60, 0.85]    # [g/cm3] the growth-mortality trade-off axis
dbh_critical       = [40.0, 80.0, 120.0]   # [cm] maximum diameter
seed_rain_recruits = [0.01, 0.01, 0.01]    # [plant/m2/yr] baseline external seed rain per PFT
# Phenomenological growth / reproduction parameters (per PFT; intrinsic growth is a capped
# log-linear function of dbh, suppressed by overtopping LAI and by reproductive allocation).
growth_dbh_slope                 = [0.25, 0.25, 0.25]   # [--]    ln-growth slope vs (ln cap - ln dbh)
growth_dbh_cap                   = [100.0, 100.0, 100.0]# [cm]    dbh above which intrinsic growth floors
growth_dbh_max                   = [1.5, 1.0, 0.5]      # [cm/yr] intrinsic growth at/above the cap
growth_lai_slope                 = [-0.5, -0.5, -0.5]   # [(m2/m2)^-1] competition suppression slope
reproduction_investment_fraction = [0.3, 0.3, 0.3]      # [--] growth fraction diverted to reproduction
repro_carbon_efficiency          = [1.0e-3, 1.0e-3, 1.0e-3] # [--] reproduction carbon -> establishable recruits

[io]
# netCDF output (needs -DMEDS_ENABLE_IO=ON, the default build; otherwise the writers are no-ops).
# Diagnostic timeseries -> <output_dir>/<output_prefix>-D-output.nc.
write_output          = true            # write the diagnostic timeseries output
output_dir            = "."             # directory for output files (created if missing)
output_prefix         = "meds_output"   # filename stem for -D-output.nc and -S-<timestamp>.nc
output_interval_years = 1               # write a diagnostic record every N years
cohort_max            = 2048            # fixed netCDF cohort dimension (must exceed live cohort count)
patch_max             = 64              # fixed netCDF patch dimension
# State checkpoints (full instantaneous state, no diagnostics) -> <output_dir>/<output_prefix>-S-<YYYYMMDDHHMMSS>.nc.
write_state           = false           # write state (restart) checkpoints
state_interval_years  = 50              # write a state checkpoint every N years (and the final year)
