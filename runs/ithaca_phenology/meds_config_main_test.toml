# MEDS MAIN config -- TEST: Ithaca NY, one cold-deciduous PFT, temperature-driven phenology.
# Run meds_main FROM THIS FOLDER so the relative paths (pft_config, io_config, output dirs) resolve:
#   cd runs/ithaca_phenology
#   source /opt/intel/oneapi/setvars.sh
#   LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$HOME/miniforge3/envs/common/lib" \
#       ../../build-ifx/meds_main meds_config_main_test.toml
# Phenology is wired so it CHANGES the run: growth_source="carbon" + phenology_on=true means the
# per-cohort ON/OFF/DORMANT status gates carbon leaf flush, and the fast loop feeds it real Ithaca
# temperature. (Under growth_source="empirical" phenology would be computed but not affect growth.)

[run]
dt_slow    = "1d"              # daily slow (demography + phenology) step
start_time = "2024-01-01"      # forcing base is 2024-01-01 01:00 -> start_clamp="hold" covers the first hour
end_time   = "2027-01-01"      # 3-year test (exclusive). Bump to "2034-01-01" for the full 10 years.

[fast]
fast_biophysics_on  = true     # REQUIRED for phenology (supplies the daily-mean temperature) + carbon GPP
dt_fast             = "1800s"  # 30 min sub-step (86400/1800 = 48, an integer multiple of dt_slow)
integration_scheme  = "split"

[demography]
demography_on             = true
do_cohort_fissfuse        = true
do_patch_disturbance      = true
do_patch_fissfuse         = true
max_cohort                = 60
n_cohort_fusion_iter      = 6
cohort_size_tol_min       = 0.02
cohort_size_tol_max       = 0.10
cohort_lai_cap            = 1.0
min_cohort_agb            = 1.0e-6
negligible_nplant         = 1.0e-8
split_eps                 = 1.0e-4
enable_cohort_fission     = true
n_height_layers           = 16
max_patch                 = 12
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10
patch_light_maxdev_factor = 1.5
patch_diff_age_tol        = 1.0
min_patch_area            = 1.0e-4
patch_min_area_remain     = 0.99
enable_patch_fission      = false
conservation_tol          = 0.001
growth_memory_days        = 90.0

[disturbance]
patch_disturbance_rate     = 0.014
disturbance_survive_height = 10.0

[recruitment]
min_recruit_size = 1.0e-2

[init]
init_mode    = 0                                   # near-bare ground (early succession over 3 yr)
restart_file = "none"
census_file  = "none"
pft_config   = "meds_config_pft_test.toml"         # the 1-PFT deciduous file in this folder

[io]
write_output          = true      # legacy quick-look diagnostic (-D-output.nc) + the PFT-parameter CSV
output_dir            = "."
output_prefix         = "ithaca"
output_interval_years = 1
cohort_max            = 2048
patch_max             = 64
write_state           = false
state_interval_years  = 50

# Diagnostic AGGREGATION output (time-averaged per-stream netCDF); io_config names the override table.
[output]
enabled       = true
dir           = "out"
prefix        = "ithaca"
io_config     = "meds_config_io_test.toml"
cohort_max    = 4096
patch_max     = 256
strict_caps   = false
sync_every    = "flush"
structure     = true
carbon_fluxes = true              # gpp/npp (need the fast loop, which is on)
water_fluxes  = false
energy_fluxes = false
[output.fast]
enabled    = false
file_chunk = "day"
[output.daily]
enabled    = true
file_chunk = "month"
[output.monthly]
enabled    = true
file_chunk = "year"
[output.annual]
enabled    = true
file_chunk = "run"

[options]
override_derived = false

[carbon]
growth_source = "carbon"          # carbon-prognostic growth so phenology (leaf flush) affects the run
gpp_ref       = 0.3               # only used if the fast loop is OFF; ignored here (fast+forcing on)

[phenology]
phenology_on = true               # advance the per-cohort cue memory + gate carbon leaf flush on it

[leaf_physiology]
stomatal_model     = "medlyn"
temp_response_form = "peaked"
colimitation       = "quadratic"
use_boundary_layer = false
kc25    = 40.49
ko25    = 27840.0
gstar25 = 4.275
ea_kc     = 79430.0
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209
leaf_absorptance = 0.85
phi_psii         = 0.85

# Meteorological forcing: the real Ithaca ERA5-Land file (single grid cell). Absolute path so it
# resolves regardless of the working directory.
[site]
latitude              = 42.44
longitude             = -76.50
utc_offset            = 0.0            # ERA5-Land is UTC
elevation             = 320.0
reference_height      = 48.0          # MUST exceed hgt_max (46)
wind_meas_height      = 10.0          # ERA5-Land wind is 10 m
apply_solar_longitude = true
apply_wind_profile    = false
apply_elevation_lapse = false
wind_roughness_z0     = 0.1
lapse_rate_tair       = 0.0065
grid_elevation        = 320.0

[forcing]
forcing_on     = true
format         = "netcdf"
path           = "/home/xiangtao/projects/MEDS/data/forcing/ithaca_forcing.nc"
grid_index     = 1                    # single-cell file (grid = 1)
grid_match     = "explicit"
timestep       = "3600s"              # hourly
avg_convention = "end"
sw_partition   = "clearidx"           # total SWdown -> streams (Erbs)
lwdown_source  = "file"               # the file ships LWdown
co2_const      = 420.0
recycle        = true                 # reuse the 2024 file across all run years
start_clamp    = "hold"               # file record #1 is 2024-01-01 01:00 (00:00 was trimmed at prep)
