# MEDS MAIN config -- Ithaca NY, 30-year run with the NEW IMEX-ARK integrator (time_integrator     = "ark").
# Monthly aggregation output ONLY; a restart state file is written at the end of the run.
#   cd runs/ithaca_ark30
#   source /opt/intel/oneapi/setvars.sh
#   LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$HOME/miniforge3/envs/common/lib" \
#       ../../build-ifx/meds_main meds_config_main.toml

[run]
dt_slow    = "1d"
start_time = "2024-06-01"
end_time   = "2024-07-01"      # 30-year run (exclusive)

[fast]
fast_biophysics_on  = true
dt_fast             = "15s"  # 30 min (48 sub-steps/day)
integration_scheme  = "split"  # (orthogonal coupling switch; unused when time_integrator     = "ark")
time_integrator     = "ark"    # <<< THE NEW INTEGRATOR: coupled IMEX-ARK (ARS(2,2,2))
ark_adaptive        = true
ark_fixed_substep   = 1
ark_rtol            = 1.0e-3
ark_niter           = 8
ark_relax           = 0.6
fast_probe          = false               # sub-daily diagnostic probe (per-substep CAS temp / GPP / ET / soil)
fast_probe_file     = "out/fastt_probe.csv"

[demography]
demography_on             = true
do_cohort_fissfuse        = true
do_patch_disturbance      = true
do_patch_fissfuse         = true
max_cohort                = 60
n_cohort_fusion_iter      = 6
cohort_size_tol_min       = 0.02
cohort_size_tol_max       = 0.10
cohort_lai_cap            = 1.0
min_cohort_agb            = 1.0e-6
negligible_nplant         = 1.0e-8
split_eps                 = 1.0e-4
enable_cohort_fission     = true
n_height_layers           = 16
max_patch                 = 12
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10
patch_light_maxdev_factor = 1.5
patch_diff_age_tol        = 1.0
min_patch_area            = 1.0e-4
patch_min_area_remain     = 0.99
enable_patch_fission      = false
conservation_tol          = 0.001
growth_memory_days        = 90.0

[disturbance]
patch_disturbance_rate     = 0.014
disturbance_survive_height = 10.0

[recruitment]
min_recruit_size = 1.0e-2

[init]
init_mode    = 1
census_file  = "ithaca_spinup_census.csv"
restart_file = "ithaca_split-S-20540101000000.nc"
pft_config   = "meds_config_pft.toml"

[io]
write_output          = false     # NO legacy -D diagnostic (monthly aggregation only)
output_dir            = "."
output_prefix         = "i_jun_ref"
output_interval_years = 1
cohort_max            = 2048
patch_max             = 64
write_state           = false      # <<< restart state file (a final -S-<date>.nc is written at run end)
state_interval_years  = 30

# Diagnostic AGGREGATION output: MONTHLY stream ONLY (fast/daily/annual disabled).
[output]
enabled       = true
dir           = "out_integ"
prefix        = "i_jun_ref"
io_config     = "meds_config_io.toml"
cohort_max    = 64
patch_max     = 256
strict_caps   = false
sync_every    = "flush"
structure     = true
carbon_fluxes = true
water_fluxes  = true
energy_fluxes = true
fast_interval_steps = 240
[output.fast]
enabled    = true
file_chunk = "day"
[output.daily]
enabled    = true
file_chunk = "month"
[output.monthly]
enabled    = false
file_chunk = "year"
[output.annual]
enabled    = false
file_chunk = "run"

[options]
override_derived = false

[carbon]
growth_source = "carbon"
gpp_ref       = 0.3

[phenology]
phenology_on = true

[leaf_physiology]
stomatal_model     = "medlyn"
temp_response_form = "peaked"
colimitation       = "quadratic"
use_boundary_layer = false
kc25    = 40.49
ko25    = 27840.0
gstar25 = 4.275
ea_kc     = 79430.0
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209
leaf_absorptance = 0.85
phi_psii         = 0.85

[site]
latitude              = 42.44
longitude             = -76.50
utc_offset            = 0.0
elevation             = 320.0
reference_height      = 48.0
wind_meas_height      = 10.0
apply_solar_longitude = true
apply_wind_profile    = false
apply_elevation_lapse = false
wind_roughness_z0     = 0.1
lapse_rate_tair       = 0.0065
grid_elevation        = 320.0

[forcing]
forcing_on     = true
format         = "netcdf"
path           = "/home/xiangtao/projects/MEDS/data/forcing/ithaca_forcing.nc"
grid_index     = 1
grid_match     = "explicit"
timestep       = "3600s"
avg_convention = "end"
sw_partition   = "clearidx"
lwdown_source  = "file"
co2_const      = 420.0
recycle        = true
start_clamp    = "hold"
