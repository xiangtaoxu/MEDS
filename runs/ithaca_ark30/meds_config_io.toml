# MEDS per-variable OUTPUT override table -- named by [output].io_config in the main config.
# Each entry is  variables.<registry-name> = <value>, where <value> is either
#   true | false                 (force the variable on with its default streams / off everywhere), or
#   "F D M Y"                     (an explicit stream mask: F=fast, D=daily, M=monthly, Y=annual).
# A name that matches NO registry variable is a HARD ERROR (typo guard), so every key below is a
# real variable from meds_output_registry. Overrides win over the [output] group toggles.
#
# 30-year ARK run: MONTHLY output ONLY. Every variable is pinned to the "M" stream, so the daily
# and annual tiers are empty even though the registry defaults would populate them. (These explicit
# masks win over the [output.daily]/[output.annual] enabled=false toggles, so they must be "M" here.)

[variables]
# Site-level carbon fluxes (need the fast loop, which is ON).
gpp_site      = "M"
npp_site      = "M"
# Site-level structure.
agb_site      = "M"
lai_site      = "M"
nplant_site   = "M"
basal_area_site = "M"
# Per-cohort structure.
dbh_cohort    = "M"
agb_cohort    = "M"
nplant_cohort = "M"
