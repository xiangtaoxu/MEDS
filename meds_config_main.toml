# MEDS MAIN run configuration -- all NON-PFT parameters. Read by meds_main (the CLI argument,
# default ./meds_config_main.toml). It names the PFT config file via [init].pft_config.
#
# PHILOSOPHY: no model parameter is hard-coded; EVERY key below is REQUIRED (a missing key, or
# a missing file, is a hard error). PFT-specific parameters live in the separate PFT file.
# Relative paths resolve against the directory you RUN meds_main from (the working directory).

[run]
dt_slow    = "1d"              # slow-process (demography) timestep: "1d" | "7d" | "12h" | seconds
start_time = "2000-01-01"      # first simulated date ("YYYY-MM-DD" or "YYYY-MM-DD HH:MM:SS")
end_time   = "2250-01-01"      # stop date (exclusive); 250-year spin-up

[fast]
# Fast (sub-daily) biophysics loop, nested within dt_slow. OFF by default (the coupled fast
# loop is wired in incrementally); when on, the driver runs nint(dt_slow/dt_fast) sub-steps.
fast_biophysics_on  = false    # master gate for the fast biophysics loop
dt_fast             = "900s"   # fast biophysics timestep ("900s" = 15 min); "5m" | "1h" also valid
integration_scheme  = "split"  # "split" (operator-split, default) | "picard" (leaf<->CAS fixed point)
# ---- coupled-surface (Picard) solver knobs + option selectors (only used when scheme = "picard"; ----
#      all DEFAULTED, so this whole block may be omitted) ----
# picard_max_iter     = 20            # outer-iteration cap
# picard_tol_temp     = 1.0e-3        # [K] temperature convergence tolerance
# picard_tol_shv      = 1.0e-6        # [kg/kg] CAS humidity convergence tolerance
# picard_relax        = 0.5           # under-relaxation of the next-pass seed (CAS<->ground map slope ~ -1)
# picard_fixed_iter   = false         # run a uniform pass count (GPU warp-uniform; no early exit)
# leaf_energy_model   = "diagnostic"  # "diagnostic" (steady-state leaf) | "prognostic" (leaf_energy store)
# soil_water_coupling = "lagged"      # "lagged" | "coupled" (both re-solve soil water each pass for now)

[demography]
demography_on             = true     # if false, structure is frozen (growth/mortality only)
do_cohort_fissfuse        = true     # monthly cohort recruitment + fusion/fission
do_patch_disturbance      = true     # annual treefall-gap creation
do_patch_fissfuse         = true     # annual patch fusion/termination
max_cohort                = 60       # per-patch cohort-count target (fusion relaxes to hit it)
n_cohort_fusion_iter      = 6        # tolerance-relaxation iterations
cohort_size_tol_min       = 0.02     # relative height tolerance, min
cohort_size_tol_max       = 0.10     # relative height tolerance, max
cohort_lai_cap            = 1.0      # [m2/m2] single-cohort LAI cap (split above; fusion blocked above)
min_cohort_agb            = 1.0e-6   # [kgC/m2] cull cohorts below nplant*agb
negligible_nplant         = 1.0e-8   # [plant/m2] absolute density floor
split_eps                 = 1.0e-4   # symmetric DBH perturbation on split
enable_cohort_fission     = true
n_height_layers           = 16       # vertical layers for the patch-fusion light profile
max_patch                 = 12       # patch-count target
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10     # mean light-profile distance to fuse two patches
patch_light_maxdev_factor = 1.5      # max single-layer deviation multiplier
patch_diff_age_tol        = 1.0      # [yr] same-age phase window
min_patch_area            = 1.0e-4   # cull patches below this area fraction
patch_min_area_remain     = 0.99     # stop fusing once this area fraction is kept
enable_patch_fission      = false
conservation_tol          = 0.001    # 0.1% AGB/area conservation tolerance
growth_memory_days        = 90.0     # [day] window of the moving-average growth that drives mortality

[disturbance]
patch_disturbance_rate     = 0.014   # [1/yr] fraction of area disturbed into a new age-0 gap
disturbance_survive_height = 10.0    # [m] tall (>=) cohorts die in the gap; short understory survives

[recruitment]
min_recruit_size = 1.0e-2            # [plant/m2] pool threshold to spawn a recruit cohort

[init]
init_mode    = 0                              # 0 = near-bare ground | 1 = cohort census | 2 = restart
restart_file = "meds_output-S-22500101000000.nc"  # state checkpoint (init_mode = 2)
census_file  = "examples/example_demography/census_example.csv"  # cohort CSV (init_mode = 1)
pft_config   = "meds_config_pft.toml"             # the REQUIRED PFT config file

[io]
write_output          = true            # write the diagnostic timeseries output
output_dir            = "."             # output directory (relative to the run dir; created if missing)
output_prefix         = "meds_output"   # filename stem for -D-output.nc, -S-<ts>.nc, _pft_parameters.csv
output_interval_years = 1               # write a diagnostic record every N years
cohort_max            = 2048            # fixed netCDF cohort dimension (must exceed live cohort count)
patch_max             = 64              # fixed netCDF patch dimension
write_state           = false           # write state (restart) checkpoints
state_interval_years  = 50              # write a state checkpoint every N years (and the final year)

# ------------------------------------------------------------------------------------------
# Diagnostic AGGREGATION output (OPT-IN, design archive/MEDS_IO_DESIGN.md). Absent or
# enabled=false -> the legacy [io] path above runs unchanged. When enabled, the model writes
# TIME-AVERAGED per-stream netCDF files: <prefix>-<F|D|M|Y>[-<stamp>].nc, one file per tier per
# time-chunk (annual is a single whole-run -Y.nc, site-level only). Coexists with [io].
# [output]
# enabled       = true
# dir           = "out"           # output directory
# prefix        = "run"           # filename stem
# io_config     = ""              # OPTIONAL meds_io_config.toml with per-variable overrides (§6)
# cohort_max    = 4096            # fixed cohort netCDF dim (live n must not exceed it)
# patch_max     = 256             # fixed patch netCDF dim
# strict_caps   = false           # false: warn+truncate on n>cap; true: error stop
# sync_every    = "flush"         # nc_sync durability: "flush" | "never"
#   # --- high-level flux-group toggles (switch whole variable groups) ---
#   structure     = true          # demography/size vars (nplant, dbh, agb, patch geometry, ids)
#   carbon_fluxes = true          # carbon group (gpp, nee; needs the fast loop) -- P1
#   water_fluxes  = false         # water group (transpiration, soil moisture)   -- P1
#   energy_fluxes = false         # energy group (soil temperature)              -- P1
#   # --- per-tier enable + records-per-file (fast tier is P1) ---
#   [output.fast]
#   enabled = false ; file_chunk = "day"
#   [output.daily]
#   enabled = true  ; file_chunk = "month"
#   [output.monthly]
#   enabled = true  ; file_chunk = "year"
#   [output.annual]
#   enabled = true  ; file_chunk = "run"

[options]
override_derived = false   # if true, a [derived] block in the PFT file pins mort_gamma/alpha/beta

[carbon]
# Carbon-driven growth (opt-in). "empirical" keeps the phenomenological path (default, bit-identical);
# "carbon" makes wood_carbon the prognostic size anchor, growth driven by NPP (stub GPP until canopy RT).
gpp_ref       = 0.3            # [kgC/m2 leaf/yr] stub GPP per unit leaf area (carbon mode only)

# ------------------------------------------------------------------------------------------
# Leaf phenology (OPT-IN). Absent or phenology_on=false -> the carbon leaf-flush gate is hard-wired
# ON (bit-identical to before; the empirical path ignores phenology entirely). When ON, the slow-loop
# driver advances each cohort's cue memory (GDD / chilling) from the daily-mean air temperature and
# the carbon leaf-flush gate obeys the resulting ON/OFF/DORMANT status -- so phenology only CHANGES a
# run under [carbon].growth_source="carbon". The daily temperature comes from the fast loop, so this
# REQUIRES [fast].fast_biophysics_on = true AND [forcing].forcing_on = true. Per-PFT cue parameters
# live in the PFT config file's [phenology] block. v1 wires the TEMP (bit 1) + PHOTO (bit 8) cues.
# [phenology]
# phenology_on = true

[leaf_physiology]
# Leaf-level photosynthesis + stomatal conductance: a self-contained leaf gas-exchange model
# (not yet coupled to demographic growth). MODEL-CHOICE keys are run-level; the per-PFT
# biochemical traits (Vcmax25, g1, pathway, ...) live in the PFT config file.
stomatal_model     = "medlyn"      # "leuning" | "medlyn" | "katul"
temp_response_form = "peaked"      # "arrhenius" | "peaked" (high-temperature deactivation)
colimitation       = "quadratic"   # "min" | "quadratic" (smoothed co-limitation)
use_boundary_layer = false         # couple via the leaf boundary-layer conductance (env gb)
# Shared FvCB biochemistry at 25 degC + Arrhenius/deactivation terms (Bernacchi et al. 2001).
kc25    = 40.49      # [Pa]      Michaelis constant for CO2 at 25 degC
ko25    = 27840.0    # [Pa]      Michaelis constant for O2 at 25 degC
gstar25 = 4.275      # [Pa]      CO2 compensation point (no Rd) at 25 degC
ea_kc     = 79430.0  # [J/mol]   activation energies
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0 # [J/mol]   deactivation energies (peaked form)
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0    # [J/mol/K] entropy terms (peaked form)
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209   # [mol/mol] atmospheric O2 mole fraction
leaf_absorptance = 0.85    # [--] leaf PAR absorptance (for electron transport)
phi_psii         = 0.85    # [--] PSII quantum yield (electrons/photon)

# ------------------------------------------------------------------------------------------
# Meteorological forcing (OPT-IN). Absent or forcing_on=false -> the fast loop uses the
# constant-forcing MVP (unchanged). Turn on together with [fast].fast_biophysics_on. The file
# is a MEDS multi-grid forcing NetCDF; produce one from ERA5-Land with scripts/download_era5land.py
# + scripts/prep_era5land_forcing.py. When forcing_on=true, ALL keys below are required.
# [site]
# latitude              = 42.44          # [deg +N] Ithaca NY
# longitude             = -76.50         # [deg +E] drives local solar time
# utc_offset            = 0.0            # [h] ERA5-Land is UTC -> 0
# elevation             = 320.0          # [m] site elevation (used by elevation lapse)
# reference_height      = 40.0           # [m] MUST exceed every PFT hgt_max
# wind_meas_height      = 10.0           # [m] ERA5-Land wind is 10 m
# apply_solar_longitude = true           # UTC file -> longitude gives local solar time
# apply_wind_profile    = false          # lift wind from wind_meas_height to reference_height (neutral log)
# apply_elevation_lapse = false          # lapse T/P from grid_elevation to elevation
# wind_roughness_z0     = 0.1            # [m] roughness length for the wind log-profile
# lapse_rate_tair       = 0.0065         # [K/m] environmental lapse (positive = cooling upward)
# grid_elevation        = 320.0          # [m] elevation of the forcing source grid cell
# [forcing]
# forcing_on            = true
# format                = "netcdf"       # "netcdf" | "const"
# path                  = "ithaca_forcing.nc"
# grid_index            = 1              # which (time,grid) location this polygon reads (grid_match="explicit")
# grid_match            = "explicit"     # "explicit" (use grid_index) | "nearest" ([site] lat/lon -> nearest cell)
# timestep              = "3600s"        # native forcing interval (ERA5-Land hourly)
# avg_convention        = "end"          # flux vars mean over the hour ENDING at the stamp
# sw_partition          = "clearidx"     # total SW -> streams: "clearidx" (Erbs) | "weiss_norman" | "passthrough"
# lwdown_source         = "file"         # ERA5-Land has strd
# co2_const             = 420.0          # [umol/mol] ERA5-Land has no CO2
# recycle               = true           # cycle the file if the run outruns it (whole-year files: calendar recycle)
# start_clamp           = "error"        # model start < first record: "error" | "hold"
