# MEDS MAIN run configuration -- all NON-PFT parameters. Read by meds_main (the CLI argument,
# default ./meds_config_main.toml). It names the PFT config file via [init].pft_config.
#
# PHILOSOPHY: no model parameter is hard-coded. This file lists EVERY key MEDS reads from a main
# config: a key that is set below is a model parameter or a choice the run must state, and a
# missing one is a hard error unless its block says its keys are optional; a commented-out key is
# optional and shows its default. A key that is not listed here is not a MEDS key -- a run that
# sets one stops and names it (a misspelling would otherwise run silently on the default).
# PFT-specific parameters live in the PFT file. docs/configuration.md describes every block.
# Relative paths resolve against the directory you RUN meds_main from (the working directory).

[run]
dt_slow    = "1d"              # slow-process (demography) timestep: "1d" | "7d" | "12h" | seconds
start_time = "2000-01-01"      # first simulated date ("YYYY-MM-DD" or "YYYY-MM-DD HH:MM:SS")
end_time   = "2250-01-01"      # stop date (exclusive); 250-year spin-up
# mode     = "site"            # "site" (default): one location, from [site]. "region": every selected
                               # cell of [region].box_nwse as its own polygon (see [region] at the end
                               # of this file, and docs/configuration.md "Regional runs").
# n_threads = 1                # host threads over the fast loop's PATCH axis (in a region run, over
                               # its polygons, each with a serial patch loop).
                               # Default 1 = serial. The default build has OpenMP; one configured
                               # with -DMEDS_OPENMP=OFF (or on a compiler without it) ignores this.
                               # Output is byte-identical at any thread count (the
                               # site-level reductions are folded in patch order), so this is a
                               # pure wall-clock knob. Bounded by the patch count and by per-patch
                               # cost imbalance -- each patch runs its own adaptive march.
                               # Incompatible with [fast].fast_probe (one shared, order-significant
                               # CSV); that combination is a hard config error.

# slow_on = true               # false skips the whole slow tier (growth, mortality, phenology,
                               # traits, demography, soil carbon) every step, holding the stand
                               # static while the fast loop still runs. Broader than
                               # [demography].demography_on, which freezes only restructuring.
# slow_ledger_on = true        # SITE conservation ledger across each slow step.
                               # Snapshots the site's carbon / water / energy stores either side of
                               # every slow-step operator -- allocation, growth+mortality, recruitment,
                               # cohort and patch fuse/fission, disturbance, canopy resize, soil carbon
                               # -- and prints, at end of run, what each phase could not account for,
                               # judged against the flux the phase declared.
                               # ON by default: it writes no state and changes no answer (outputs are
                               # byte-identical either way), costs ~0.3% wall clock, and a conservation
                               # check nobody runs is a conservation check nobody has. It is the ONLY
                               # thing that can see a store JUMP across the slow step -- the fast loop's
                               # own ledgers accumulate per-sub-step flux residuals and are blind to it.
                               # A phase that closes leaves round-off only, so the closing verdict line
                               # names any phase whose residual is a real leak.

[fast]
# Fast (sub-daily) biophysics loop, nested within dt_slow: when on, the driver runs
# nint(dt_slow/dt_fast) sub-steps and the slow loop is driven by the carbon they produce.
# Off here so this reference config is a pure demographic spin-up with no forcing file;
# examples/example04_column_biophysics/ turns it on. With it off, growth runs on the [carbon].gpp_ref
# stub instead of solved photosynthesis.
fast_biophysics_on  = false    # master gate for the fast biophysics loop
dt_fast             = "900s"   # fast biophysics timestep, an ACCURACY setting, not a stability limit:
                               # the CAS<->atm surface layer is re-solved at every stage, so the canopy
                               # air is stable at every dt_fast measured. 900 s is the edge of the
                               # measured range (a longer step warns). Leaf gas exchange is frozen over
                               # each step at the step-start leaf potential, and leaf water is solved
                               # implicitly with the soil's to keep that lag small; see
                               # docs/science/numerical_scheme.md §5a and §6.
# ---- The time integrator and its error control (docs/science/numerical_scheme.md). Every key
#      is optional, at the default shown. ----
# time_integrator     = "ark"        # "ark" (ESDIRK2) | "rk45" (explicit, for comparison)
# ark_adaptive        = true         # adaptive substeps under the error control; false = a fixed number
# ark_fixed_substep   = 4            # [-]  substeps per dt_fast when ark_adaptive = false
# ark_dt_init         = 0.0          # [s]  first adaptive substep (0 = warm start: the substep the patch's
#                                    #   previous dt_fast converged to, or dt_fast on its first)
# ark_rtol            = 1.0e-3       # [-]  relative tolerance, for every tolerance group
# rtol_all            = 0.0          # [-]  > 0: one accuracy target for every group (0 = unset)
# atol_scale          = 1.0          # [-]  multiplier on every group's absolute tolerance
# error_level         = "adaptive"   # "fixed" | "adaptive" | "strict" (adaptive, and a substep that
#                                    #   cannot meet the tolerance at the floor step is an error)
# step_controller     = "i"          # "i" (integral) | "pi" (proportional-integral: damps step-size hunting)
# ark_coupled         = true         # the leaf <-> canopy-air surface solve: true = coupled Newton,
#                                    #   false = one uncoupled backward-Euler pass
# ---- Process switches and initial seeds. ----
# forcing_sample_frac = 0.5          # [-]  where in each sub-step the forcing is sampled, in [0, 1]
# cas_condensation    = true         # condense canopy-air supersaturation
# canopy_water_on     = false        # canopy interception film and its evaporation (condensate goes to soil layer 1)
# snow_init_swe       = 0.0          # [kg/m2] snow water equivalent seeded at the run start
# snow_init_temp      = 270.0        # [K]  temperature of that seeded pack
# fast_probe          = false        # one CSV row per (patch, sub-step), for debugging; needs n_threads = 1
# fast_probe_file     = "fast_probe.csv"
# ---- The process mask: switch one prognostic store off to isolate a process (all on = the full
#      column). ----
# mask.veg_energy     = true         # leaf and wood energy
# mask.cas_energy     = true         # canopy-air enthalpy
# mask.cas_vapour     = true         # canopy-air humidity
# mask.cas_co2        = true         # canopy-air CO2
# mask.soil_heat      = true         # soil heat
# mask.soil_water     = true         # soil water
# mask.hydraulics     = true         # plant hydraulics

[hydraulics]
# Plant-hydraulics traits, consumed ONLY when [fast].fast_biophysics_on = true: pressure-volume curves
# (Bartlett/Tyree-Hammel) per tissue, xylem vulnerability, the sapwood path and the roots
# (docs/science/plant_hydraulics.md). Every key is OPTIONAL: it defaults to the value shown, so the
# whole block may be omitted. Each is also a per-PFT trait: pft.<key> in the PFT file overrides it
# for that PFT. wood_kexp = 1 or 2 keeps a closed form of the Kirchhoff integral (ln, atan); any
# other value uses the lookup table build_hydro_table precomputes (plant_hydraulics.md eq. (8)).
leaf_pi0       = -1.5      # [MPa]        leaf osmotic potential at full turgor (PV curve: eqs. (3)-(6))
leaf_elastic_mod       = 12.0      # [MPa]        leaf bulk elastic modulus
leaf_apoplast_frac        = 0.30      # [-]          leaf apoplastic fraction
leaf_water_sat = 2.0       # [kg H2O/kgC] leaf saturated water content
wood_pi0       = -1.0      # [MPa]        wood osmotic potential at full turgor
wood_elastic_mod       = 8.0       # [MPa]        wood bulk elastic modulus
wood_apoplast_frac        = 0.20      # [-]          wood apoplastic fraction
wood_water_sat = 1.0       # [kg H2O/kgC] wood saturated water content
wood_psi50     = -2.0      # [MPa,<0]     xylem potential at 50% loss of conductance (eq. (7))
wood_kexp      = 2.0       # [-]          vulnerability shape (1 or 2: closed form; else lookup table)
# ---- the plant's maximum internal conductance is its sapwood's, wood_kmax * sapwood area /
#      (height * vessel_curl). wood_kmax is a PFT trait: by default exp(2.348 - 2.455 rho + 0.6186/2)
#      [kg/m/s/MPa] from the PFT's wood density rho (Xu et al. 2016, tropical trees; ED2), which
#      pft.wood_kmax overrides (plant_hydraulics.md eqs. (10)-(11)).
vessel_curl    = 1.5       # [-]          tortuosity / path-length factor
# ---- roots, plant traits (pft.<key> overrides each per PFT). A cohort roots to root_depth_b1 *
#      height^root_depth_b2 [m] (ED2's height allometry, IALLOM 1: 5 m at 35 m), capped at the soil
#      column; its fine roots fall off within that depth as ED2's (1 - root_beta^(d/D)) / (1 - root_beta)
#      above depth d. Its root length (fine-root carbon * specific_root_length) sets each layer's
#      soil->root conductance, 2 pi K L / ln(r_half / fine_root_radius) (Gardner 1960)
#      (plant_hydraulics.md eqs. (12)-(14)).
root_beta            = 0.1        # [-]     share of the profile that would lie below the rooting depth (0,1)
root_depth_b1        = 1.1140580  # [m]     rooting depth = b1 * height[m]^b2
root_depth_b2        = 0.4223014  # [-]
specific_root_length = 2.0e4      # [m/kgC] fine-root length per unit fine-root carbon: 10 m per g dry mass, the
                                  #         tropical fine roots of Panama (Wurzburger & Wright 2015; Cordeiro et
                                  #         al. 2024) and GRooT, times 2 g dry per g C. All fine-root carbon counts:
                                  #         the 0-1 mm roots hold 92 % of the length.
fine_root_radius     = 2.5e-4     # [m]     fine-root radius: tropical fine-root diameters are 0.4-0.6 mm

[soil]
# Soil-water options, consumed by the fast loop. Every key is OPTIONAL: it defaults to the value
# shown, so the whole block may be omitted (the meds_biophysics_opts defaults).
# Soil and plant water are solved together as one network (implicit Euler with Newton and its own
# sub-steps; docs/science/soil_plant_water.md); rtol/atol set its error. This is NOT the soil
# geometry/texture (see [soil_column]).
bottom_bc      = "free_drain" # free_drain | aquifer | bedrock   (bottom boundary condition)
rtol           = 1.0e-3       # [-]      water-network sub-step relative tolerance
atol           = 1.0e-4       # [-]      water-network sub-step absolute tolerance: water content for soil
                              #          layers and the pond, relative water content for plant tissues
w_pond_max     = 5.0          # [kg/m2]  ponding capacity before surface runoff
intercept_alpha = 1.0         # [-]      Beer interception efficiency
intercept_k     = 0.5         # [1/PAI]  Beer interception extinction
dsl_dmax       = 0.015        # [m]      dry-surface-layer max thickness (soil evaporation)
dsl_theta_init = 0.8          # [-]      DSL initiation theta_1/theta_sat
ground_albedo_vis = 0.15      # [-]      bare-soil albedo, visible
ground_albedo_nir = 0.30      # [-]      bare-soil albedo, near infrared
ground_emissivity = 0.95      # [-]      bare-soil longwave emissivity

# ------------------------------------------------------------------------------------------
# [soil_column] -- the PHYSICAL soil column the soil water above is solved OVER.
# [soil] holds the water network's tolerances and the bottom BC; this is the ground itself:
# the vertical grid, the hydraulic texture and the thermal texture.
#
# Every key is OPTIONAL and defaults to the value shown. The values below are a generic loam,
# NOT a measured soil: replace them for a real site. Validated at load: a
# non-positive depth, layer_bottoms that do not increase or do not reach the depth,
# theta_sat <= theta_res, or a van Genuchten n <= 1 are hard errors, because each one produces a
# silently wrong column rather than a crash.
[soil_column]
depth       = 2.0          # [m]      total column depth
#
#   NOTE ON `depth`. 2.0 m is about one annual thermal damping depth at a mid-latitude site
#   (1.97 m for this texture at theta = 0.3), so the annual temperature wave has barely attenuated
#   at the base, and a zero-flux base reflects it instead of letting it decay. Deepening the column,
#   or the dirichlet base in [energy], is the fix (not extrapolating the gradient, which is
#   degenerate). Changing it changes soil temperature.
#
#   The layers are SoilGrids 2.0's depths (bottoms 0.05, 0.15, 0.30, 0.60, 1.00 m), then 1.5,
#   2.0, 3.0, 4.5, 6.5, 9.0, 12, 16, 21 and 27 m, cut at `depth`; a remainder thinner than half
#   the layer it falls in joins the layer above. layer_bottoms replaces that list (a measured
#   profile); the column then ends at its last bottom unless `depth` is set.
# layer_bottoms = [0.05, 0.15, 0.30, 0.60, 1.00, 1.50, 2.00]   # [m] layer bottoms, positive down
retention   = "van_genuchten"   # van_genuchten | campbell
theta_sat   = 0.43         # [m3/m3]  porosity
theta_res   = 0.078        # [m3/m3]  residual water content
ksat        = 2.89e-6      # [m/s]    saturated hydraulic conductivity
curve_par_a = 3.6          # [1/m] van Genuchten alpha  OR  [m] Campbell psi_sat (negative)
curve_par_n = 1.56         # [-]   van Genuchten n (>1)  OR  [-] Campbell b
psi_fc      = -3.37        # [m]      field-capacity matric head (derives theta_fc)
solid_conductivity = 3.0   # [W/m/K]  mineral-solid thermal conductivity
dry_conductivity   = 0.15  # [W/m/K]  dry-matrix thermal conductivity
dry_heat_capacity  = 2.0e6 # [J/m3/K] dry-matrix volumetric heat capacity

[energy]
# Soil-thermal (backward-Euler heat) options. Every key OPTIONAL; defaults shown.
# The solve is ONE unconditionally-stable BE step -- there is no substepping here, and the accuracy
# of the integrated soil energy is controlled by the outer adaptive march (tolerance group GRP_SE,
# docs/science/numerical_scheme.md eq. (3)), not by this block.
atol           = 1.0e-2       # [K]  budget-closure threshold for the debug halt (NOT a step tolerance)
# debug_error    = false        # true: a budget breach above atol STOPS the run (for bisecting one);
                              #   false: it is reported and the run goes on

#----- THERMAL bottom boundary. NOTE this is [energy].bottom_bc, NOT [soil].bottom_bc -- the latter
#      is the WATER boundary (free_drain | bedrock | aquifer). Two different keys, two different
#      physics, same name in different blocks.
#
#      `geothermal` (the DEFAULT) prescribes the bottom FLUX, hard-wired to zero, which makes the
#      base an adiabatic wall that REFLECTS the annual temperature wave. Against the analytic
#      semi-infinite profile it leaves the amplitude at -1.73 m 82 % too large (0.764 of the surface
#      where the analytic value is 0.421); `dirichlet` lands at 0.412, i.e. -2 %. In a full model run
#      at Ithaca the difference is 4.3 K in July soil temperature at the column base, and it matters
#      for anything keyed to deep soil temperature -- soil-carbon Q10, root-zone temperature, and the
#      timing of spring thaw. See docs/science/soil_biophysics.md, "The bottom thermal boundary"
#      (eq. (12)), and test_soil_annual_damping in test/test_column_energy.f90.
#
#      It is NOT switched on by default because `deep_temp` is a SITE property with no defensible
#      global value, and the loader refuses to guess it. Set both keys, or accept the reflecting base
#      knowingly.
bottom_bc      = "geothermal" # geothermal (adiabatic base, REFLECTS the annual wave) | dirichlet
#deep_temp     = 284.75       # [K]  REQUIRED by dirichlet. Mean annual soil temperature below the
                              #      annual damping depth ~ mean annual AIR temperature + 1..2 K.
                              #      An error here is a steady flux into the column base, i.e. a
                              #      mean-annual bias of about the same size at depth.
#deep_depth    = 3.145        # [m]  depth of the anchor PLANE. The default is the derived optimum
                              #      for the DEFAULT column (2 m on the default layers, bottom node
                              #      1.75 m): a purely resistive termination reflects least at
                              #      l = d/sqrt(2), giving 1.75 + 1.973/sqrt(2) = 3.145 m
                              #      (soil_biophysics.md eq. (13)). CHANGE IT if you change the
                              #      column depth or the soil's thermal texture.

[snow]
# Snow / temporary-surface-water PHYSICAL parameters (docs/science/snow_biophysics.md). The snow store is
# ALWAYS ACTIVE -- snowfall is a boundary water input like rain, so there is no on/off switch; a
# column with no pack and no snowfall simply never enters the stage. Every key OPTIONAL; defaults
# shown. (The [fast] block holds the initial-state seeds; this block holds the physical constants.)
rho_snow           = 250.0    # [kg/m3] fixed seasonal-mean bulk density (depth = swe/rho)
k_snow             = 0.15     # [W/m/K] snow thermal conductivity
albedo_vis_fresh   = 0.85     # [-]     fresh-snow VIS albedo
albedo_nir_fresh   = 0.65     # [-]     fresh-snow NIR albedo
albedo_vis_aged    = 0.518    # [-]     aged VIS endpoint (ED2)
albedo_nir_aged    = 0.435    # [-]     aged NIR endpoint (ED2)
snow_emiss         = 0.97     # [-]     thermal (LW) emissivity
liquid_holding_frac = 0.10    # [-]     percolation holding capacity (LEAF-3 1:9)
snow_stab_thresh   = 3.0      # [kg/m2] active-integration floor (thinner packs stay passive)
min_new_snow_mass  = 1.0e-3   # [kg/m2] first-flake creation threshold
tiny_snow_mass     = 1.0e-6   # [kg/m2] melt-out threshold (dump residual to soil)
ny07_a             = 2.5      # [-]     Niu-Yang07 snow-cover-fraction shape factor
ny07_m             = 1.0      # [-]     Niu-Yang07 snow-cover-fraction exponent
z0_snow            = 0.001    # [m]     snow surface roughness (aerodynamic burial floor)

[aerodynamics]
# Canopy-aerodynamics run constants (CLM5 Monin-Obukhov + ED2 boundary layers;
# docs/science/canopy_aerodynamics.md, whose equation numbers are cited below). Every key OPTIONAL;
# the defaults are ED2/CLM5 reference values. (The von Karman constant lives in meds_constants; the Nusselt
# leaf/wood coefficient tables keep their literature defaults and are not exposed here.)
z0m_ratio        = 0.13       # [-]   z0m / canopy height (ED2 vh2vr), eq. (1)
d_ratio          = 0.63       # [-]   displacement / canopy height (ED2 vh2dh), eq. (1)
snow_rough       = 0.001      # [m]   snow-surface roughness (blend floor)
zeta_m           = 1.574      # [-]   CLM5 momentum-range transition
zeta_t           = 0.465      # [-]   CLM5 scalar-range transition
zeta_max_stable  = 0.5        # [-]   CLM5 zetamaxstable (init-guess cap)
n_iter_mo        = 4          # [-]   fixed Monin-Obukhov iterations (GPU-uniform)
wc               = 0.5        # [m/s] convective velocity scale (MoninObukIni)
ustmin           = 0.10       # [m/s] friction-velocity floor
ubmin            = 0.65       # [m/s] bulk-wind floor, eq. (2)
ugbmin           = 0.25       # [m/s] canopy-top and in-canopy wind floor
gbhmos_min       = 1.0e-9     # [m/s] boundary-layer conductance floor, eq. (10)
min_canopy_depth = 5.0        # [m]   canopy-air-space depth floor
canopy_freeboard = 5.0        # [m]   CAS depth ABOVE the tallest cohort (can_depth = h_top + this)
cs_dense         = 0.004      # [-]   CLM4 dense-canopy ground-conductance scale, eq. (6)
gamma_g          = 0.5        # [-]   CLM4 dense-canopy stability factor, eq. (6)
gbh_2_gbw        = 1.075      # [-]   boundary-layer heat:vapour conductance ratio
kin_visc0        = 1.33e-5    # [m2/s] kinematic viscosity at t_ref_air
dkin_visc        = 0.007      # [1/K] kinematic-viscosity linear-in-T slope
th_diff0         = 1.89e-5    # [m2/s] thermal diffusivity at t_ref_air
dth_diff         = 0.007      # [1/K] thermal-diffusivity linear-in-T slope
t_ref_air        = 293.15     # [K]   reference temperature for the linear-in-T air properties

[demography]
demography_on             = true     # if false, structure is frozen (growth/mortality only)
do_cohort_fissfuse        = true     # monthly cohort recruitment + fusion/fission
do_patch_disturbance      = true     # annual treefall-gap creation
do_patch_fissfuse         = true     # annual patch fusion/termination
max_cohort                = 60       # per-patch cohort-count target (fusion relaxes to hit it)
n_cohort_fusion_iter      = 6        # tolerance-relaxation iterations
cohort_size_tol_min       = 0.02     # height tolerance as a share of the patch's top height, first pass
cohort_size_tol_max       = 0.10     # its ceiling
cohort_lai_cap            = 1.0      # [m2/m2] single-cohort LAI cap (split above; fusion blocked above)
min_cohort_agb            = 1.0e-6   # [kgC/m2] cull cohorts below nplant*agb
negligible_nplant         = 1.0e-8   # [plant/m2] density floor: mortality stops here, and the cull removes a cohort at it
split_eps                 = 1.0e-4   # symmetric DBH perturbation on split
enable_cohort_fission     = true
n_height_layers           = 16       # vertical layers for the patch-fusion light profile
max_patch                 = 12       # patch-count target; patch_light_tol_max can keep more
n_patch_fusion_iter       = 6
patch_light_tol           = 0.10     # mean light-profile distance to fuse two patches (first pass)
patch_light_tol_max       = 0.15     # ceiling of that tolerance: no fusion beyond it, even above max_patch
patch_light_maxdev_factor = 1.5      # max single-layer deviation multiplier
patch_diff_age_tol        = 1.0      # [yr] same-age phase window
min_patch_area            = 1.0e-4   # cull patches below this area fraction
patch_min_area_remain     = 0.99     # stop fusing once this area fraction is kept
enable_patch_fission      = false
conservation_tol          = 0.001    # 0.1% AGB/area conservation tolerance
growth_memory_days        = 365.0    # [day] window of the moving-average growth that drives mortality: a
                                     #       full year, so a seasonal pause in growth is not read as decline
                                     #       (census growth, which the mortality laws are fitted on, is annual).
                                     #       The diameter sink limit is a budget over the same window.

[disturbance]
patch_disturbance_rate     = 0.014   # [1/yr] fraction of area disturbed into a new age-0 gap
disturbance_survive_height = 10.0    # [m] tall (>=) cohorts die in the gap; short understory survives

[recruitment]
min_recruit_size = 1.0e-2            # [plant/m2] pool threshold to spawn a recruit cohort

[init]
init_mode    = 0                              # 0 = near-bare ground | 1 = cohort census | 2 = restart
restart_file = "meds_output-S-22500101000000.nc"  # state checkpoint (init_mode = 2)
census_file  = "data/census_example.csv"  # cohort CSV (init_mode = 1)
pft_config   = "meds_config_pft.toml"             # the REQUIRED PFT config file
# soil_temp          = 288.0      # [K]      initial soil temperature, every layer (init_mode 0 and 1)
# soil_theta         = 0.30       # [m3/m3]  initial soil moisture, every layer (init_mode 0 and 1)
# reacclimate_traits = false      # restart only: re-derive the plastic leaf traits from THIS run's PFT
#                                 #   file rather than keep the state file's

[state]
# The STATE (restart) stream + the run's PFT provenance table. Diagnostics are the [output]
# block below.
output_dir            = "."             # directory for the restart files + _pft_parameters.csv
output_prefix         = "meds_output"   # filename stem for -S-<ts>.nc and _pft_parameters.csv
write_state           = false           # write state (restart) checkpoints
interval_years  = 50              # write a checkpoint every N years (and the final year)

# ------------------------------------------------------------------------------------------
# DIAGNOSTIC output. Writes TIME-AVERAGED per-stream netCDF files
# <prefix>-<F|D|M|Y>[-<stamp>].nc -- one file per tier per time-chunk (annual is a single
# whole-run -Y.nc, with no cohort or patch axis). Every registered variable belongs to one of the
# nine groups below and has one of seven axes (docs/science/diagnostics.md).
#
# Run `meds_main --dump-io-config` to generate a fully-commented meds_io_config.toml listing
# EVERY variable with its default streams, ready to uncomment. That is the per-variable
# (debugging) control; the switches here are the coarse control.
#
# Resolution order, later wins: registry defaults -> axis toggles -> group toggles ->
# per-tier enable -> per-variable overrides in meds_io_config.toml.
[output]
enabled       = false           # master switch
dir           = "out"           # output directory
prefix        = "meds"          # filename stem
io_config     = ""              # OPTIONAL meds_io_config.toml with per-variable overrides
cohort_max    = 4096            # fixed cohort netCDF dim (live n must not exceed it)
patch_max     = 256             # fixed patch netCDF dim
fast_interval_steps = 4         # a FAST record spans this many dt_fast sub-steps (4 x 900 s = hourly)
sync_every    = "flush"         # nc_sync durability: "flush" | "never". Closed records are written at
                                #   month boundaries (the I/O phase), so a crash loses at most the
                                #   current month's output; the checkpoint bounds the rerun

  # --- VARIABLE GROUPS. The seven that make a run judgeable are on; the two heavy evaluation
  #     groups are off. `numerics` carries the budget residuals -- a closure nobody records is
  #     worse than one nobody looks at, so it defaults ON.
  structure     = true          # demography / size / identity / patch geometry
  carbon        = true          # GPP, NPP, Ra, allocation, vegetation carbon stocks
  water         = true          # ET, soil moisture / potential, snow, surface water
  energy        = true          # LE, H, Rnet, temperatures, canopy-air state
  biogeochem    = true          # CENTURY soil-carbon pools, Rh, litterfall
  numerics      = true          # integrator work counters + energy/water budget residuals
  forcing       = true          # the forcing the run used: T, q, P, wind, LW, the 4 SW streams, snow,
                                #   CO2, cos(zenith), air density (daily/monthly/yearly means + *_fast)
  radiation     = false         # albedo, absorbed SW/PAR/LW, ground radiation
  ecophys       = false         # PER-COHORT leaf gas exchange + hydraulics (highest volume)

  # --- AXES. Suppress a whole trailing dimension without naming variables. This is the biggest
  #     single lever on output volume ("site level only, nothing per-cohort").
  axes_cohort     = true
  axes_patch      = true
  axes_pft        = true
  axes_size       = true
  axes_soil_patch = false       # 2-D (soil layer x patch) columns; highest-volume non-cohort axis

  # --- DBH size classes (the `dbh_class` axis). Ascending edges [cm]; n_class = len - 1.
  #     Binning is ED2-style, a size class of PLANTS: a cohort lands whole in the bin of its
  #     mean dbh and is weighted by area*nplant, so sum over classes == the site total exactly.
  dbh_class_edges = [0.0, 10.0, 20.0, 30.0, 50.0, 70.0, 100.0]

  # --- per-tier enable + records-per-file (the time-chunk) ---
  #     ONE key per line: meds_toml does not accept `;` as a key separator, so a folded line here
  #     hard-errors the moment [output].enabled turns on (it parsed the whole tail as the value).
  [output.fast]
  enabled = false
  file_chunk = "day"
  [output.daily]
  enabled = true
  file_chunk = "month"
  [output.monthly]
  enabled = true
  file_chunk = "year"
  [output.annual]
  enabled = true
  file_chunk = "run"

[options]
override_derived = false   # if true, a [derived] block in the PFT file pins mort_gamma/alpha/beta

[carbon]
gpp_ref       = 0.3            # [kgC/m2 leaf/yr] stub GPP per unit leaf area, used when the fast loop is off

# ------------------------------------------------------------------------------------------
# Leaf phenology runs in every run's slow loop; there is no switch. Once a day the slow-loop driver
# advances each cohort's cue memory (degree-day sums of the daily-mean air temperature, hours of
# light, predawn leaf-water-potential sums) and turns it into a flush and a shed tendency that set
# the cohort's leaf growth and loss (docs/science/plant_phenology.md). The daily temperature comes
# from the fast loop. Per-PFT cue parameters live in the PFT config file's [phenology] block.

[trait_dynamics]
# Light acclimation of leaf traits (docs/science/plant_traits.md).
# trait_plasticity_on = false     # acclimate each cohort's leaf traits (sla, vcmax25, rd25, llspan)
                                  #   to the leaf area above it; false keeps the PFT's top-of-canopy values
# fineroot_lifespan_plastic = false  # with plasticity on: fine-root turnover x (top-of-canopy leaf lifespan
                                  #   / the cohort's), so shaded roots are replaced as slowly as shaded leaves

[leaf_physiology]
# Leaf-level photosynthesis + stomatal conductance (docs/science/leaf_gas_exchange.md), solved by
# the fast loop; with [fast].fast_biophysics_on its GPP is the carbon growth runs on. MODEL-CHOICE
# keys are run-level; the per-PFT biochemical traits (Vcmax25, g1, pathway, ...) live in the PFT
# config file.
stomatal_model     = "medlyn"      # "leuning" | "medlyn" | "katul" (leaf_gas_exchange.md §3.1-3.3)
temp_response_form = "peaked"      # "arrhenius" | "peaked" (high-temperature deactivation)
colimitation       = "quadratic"   # "min" | "quadratic" (smoothed co-limitation)
use_boundary_layer = false         # couple via the leaf boundary-layer conductance (env gb)
# Shared FvCB biochemistry at 25 degC + Arrhenius/deactivation terms (Bernacchi et al. 2001);
# the C3 rates are leaf_gas_exchange.md eqs. (2)-(3).
kc25    = 40.49      # [Pa]      Michaelis constant for CO2 at 25 degC
ko25    = 27840.0    # [Pa]      Michaelis constant for O2 at 25 degC
gstar25 = 4.275      # [Pa]      CO2 compensation point (no Rd) at 25 degC AND 20.9% O2
                     #           (Bernacchi 2001). Gamma* is proportional to O2, so it is
                     #           scaled by o2_mol_frac/0.209 -- exactly 1 at the default.
ea_kc     = 79430.0  # [J/mol]   activation energies
ea_ko     = 36380.0
ea_gstar  = 37830.0
ea_vcmax  = 65330.0
ea_jmax   = 43540.0
ea_rd     = 46390.0
hd_vcmax  = 200000.0 # [J/mol]   deactivation energies (peaked form)
hd_jmax   = 200000.0
hd_rd     = 200000.0
ds_vcmax  = 650.0    # [J/mol/K] entropy terms (peaked form)
ds_jmax   = 640.0
ds_rd     = 490.0
o2_mol_frac      = 0.209   # [mol/mol] atmospheric O2 mole fraction
leaf_absorptance = 0.85    # [--] leaf PAR absorptance (for electron transport)
phi_psii         = 0.74    # [--] electron yield of linear transport in low light: J's initial slope is
                           #   0.5*phi_psii electrons per absorbed photon. 0.74 gives 0.37, the measured
                           #   maximum CO2 yield of C3 leaves (0.093 per absorbed photon, Long et al. 1993)
                           #   at 4 electrons per CO2 (Aj's 4ci + 8 Gamma*). Not Fv/Fm (0.85): with it the
                           #   leaf would fix CO2 at the O2-evolution yield (0.106, Bjorkman & Demmig 1987)
# medlyn_vpd_min   = 0.05    # [kPa] OPTIONAL: the leaf-to-air VPD the Medlyn stomatal model uses at least
                            #   (g1/sqrt(D) is undefined at D = 0); it caps gs on humid nights and rainy hours.
                            #   CLM5's value (PhotosynthesisMod: VPD at least 50 Pa); eq. (6)
# Thermal acclimation (Kattge & Knorr 2007; leaf_gas_exchange.md eq. (4)): ds_vcmax, ds_jmax and
# Jmax/Vcmax follow the running-mean growth temperature Tg [degC]: ds = a - b*Tg, Jmax/Vcmax =
# a - b*Tg. Only with temp_response_form = "peaked". Every key optional, at the published values shown.
# thermal_acclimation = false
# acclim_ds_vcmax_a   = 668.39     # [J/mol/K]
# acclim_ds_vcmax_b   = 1.07       # [J/mol/K2]
# acclim_ds_jmax_a    = 659.70     # [J/mol/K]
# acclim_ds_jmax_b    = 0.75       # [J/mol/K2]
# acclim_jv_a         = 2.59       # [-]
# acclim_jv_b         = 0.035      # [1/K]
# acclim_window_days  = 30.0       # [day] growth-temperature running-mean window

[soil_carbon]
# The CENTURY soil-carbon matrix (docs/science/soil_carbon.md). Every key optional; the defaults
# shown are ED2's, so the block may be omitted. Rates are per year.
# soil_carbon_on      = true       # master switch: false is NO soil carbon, not a coarser one
# decomp_scheme       = "ed2"      # "ed2" | "century5" (the texture-controlled scheme 5)
# step_solver         = "euler"    # "euler" | "expm" (matrix exponential)
# k_fast              = 11.0       # [1/yr] baseline decay rates
# k_struct            = 4.5
# k_micr              = 0.0        #   0 = inert (scheme 5: 6.0)
# k_slow              = 0.2
# k_pass              = 0.0        #   0 = inert (scheme 5: 0.012)
# er_fast             = 1.0        # [-]  fractions respired on decay
# er_struct_nonlig    = 0.3
# er_struct_lig       = 0.3
# er_slow             = 1.0
# er_pass             = 1.0
# e_lignin            = 3.0        # [-]  lignin brake: decay x exp(-e_lignin * lignin fraction)
# er_micr_int         = 0.0        # [-]  scheme 5: microbial respired fraction = int + slp * xsand
# er_micr_slp         = 0.0
# xsand               = 0.35       # [-]  sand fraction
# xclay               = 0.25       # [-]  clay fraction
# fx_micr_pass_int    = 0.003      # [-]  scheme 5: microbial -> passive routing = int + slp * xclay
# fx_micr_pass_slp    = 0.032
# fx_slow_pass_int    = 0.003      # [-]  scheme 5: slow -> passive routing = int + slp * xclay
# fx_slow_pass_slp    = 0.009
# rh_q10              = 1.5        # [-]  Q10 of decomposition (scheme 5)
# rh_t_ref            = 288.15     # [K]  its reference temperature
# resp_temp_increase  = 0.0757     # [1/K] ED2 temperature response: slope
# resp_temp_ref       = 318.15     # [K]  and its saturation temperature
# resp_opt_water      = 0.8938     # [-]  ED2 water response: optimum relative moisture
# resp_water_below_opt = 5.0786    # [-]  and its shape below and above the optimum
# resp_water_above_opt = 4.5139
# spinup_steady       = false      # start from the semi-analytic steady state (SASU), not from zero
# spinup_xi           = 1.0        # [-]  its climatological mean environmental scalar
# spinup_labile_grnd  = 0.0        # [kgC/m2/day] its constant litter estimate, per input pool
# spinup_labile_soil  = 0.0
# spinup_struct_grnd  = 0.0
# spinup_struct_soil  = 0.0

# ------------------------------------------------------------------------------------------
# Meteorological forcing (OPT-IN; docs/science/forcing.md). Absent or forcing_on=false -> the fast
# loop runs against a constant reference climate. Turn on together with [fast].fast_biophysics_on.
# Two sources:
#   format = "ED_ERA5land"  the global ED_ERA5land archive (per-variable monthly files, built with
#                        scripts/prepare_era5/). The reader finds the site's cell itself, takes its
#                        elevation from the archive's static file, converts dewpoint to specific
#                        humidity with the model's own saturation curve, and carries the wind vector.
#                        Keys: data_path and max_distance_km; NOT path, grid_index, grid_match or
#                        [site].grid_elevation (rejected if present).
#   format = "ED_default"   one multi-grid forcing NetCDF: from ERA5-Land with
#                        scripts/prepare_era5/make_forcing_file.py (from an ED_ERA5land archive or a
#                        small download), or from flux-tower data with
#                        scripts/prepare_flux_tower/make_tower_forcing.py. Keys: path, grid_index,
#                        grid_match. The file carries the humidity its source measured (RHair, Tdew
#                        or Qair, exactly one), and MEDS converts it with its own saturation curve.
# Every forcing clock is UTC: a file must say time_zone = "UTC", and local time is a matter for
# the post-processing of the output. When forcing_on=true, every other key below is required.
# [site]
# latitude              = 42.44          # [deg +N] Ithaca NY
# longitude             = -76.50         # [deg +E] with the UTC clock, gives local solar time
# elevation             = 320.0          # [m] site elevation (used by elevation lapse)
#   ---- TERRAIN lapse, from the forcing cell's elevation to the site's (docs/science/forcing.md §8):
#   T by the lapse rate, P hydrostatically, q at constant relative humidity, file LWdown by the
#   clear-sky eps*T^4 ratio. Region polygons sit at their cell's elevation, so it is a no-op there.
#   lapse_rate_tair and grid_elevation are read only when the lapse is on (refused when it is off);
#   a flux tower measures at the site, so it runs with the lapse off.
# apply_elevation_lapse = true
# lapse_rate_tair       = 0.0065         # [K/m] one rate, or twelve (January .. December), e.g. the
#                                        # N. Hemisphere monthly rates of Kunkel (1989), as tabulated by
#                                        # Liston & Elder (2006, MicroMet, Table 1):
#                                        # [0.0044, 0.0059, 0.0071, 0.0078, 0.0081, 0.0082,
#                                        #  0.0081, 0.0081, 0.0077, 0.0068, 0.0055, 0.0047]
# grid_elevation        = 367.5          # [m] the forcing cell's elevation (format = "ED_default" only;
#                                        # the archive reads it from its static file)
# [forcing]
# forcing_on            = true
# format                = "ED_default"   # "ED_ERA5land" | "ED_default" | "const"
#   ---- format = "ED_ERA5land" -----------------------------------------------------------------
# data_path             = "/path/to/ED_ERA5land"   # the archive folder (installation-specific)
# max_distance_km       = 15.0           # a site on a no-data cell (coast, lake edge) takes the nearest
#                                        # valid cell within this distance; farther is an error
# file_template         = "{data_path}/ED_ERA5land_{var}_{yyyy}{mm}.nc"   # optional; the default shown
# static_file           = "{data_path}/ED_ERA5land_static.nc"             # optional; the default shown
#   The months read are the recycle window when recycle = true, else the run period; every file
#   they need must exist when the run starts. A run starting at 00:00 on the 1st also reads the
#   previous month's file, which holds that record (the archive stamps the END of each hour).
#   The reader loads one month (plus that record) before each step, so format = "ED_ERA5land" needs
#   [run].dt_slow = "1d" and a start_time at 00:00:00.
#   ---- format = "ED_default" ------------------------------------------------------------------
# path                  = "ithaca_forcing.nc"
# grid_index            = 1              # which (time,grid) location this polygon reads (grid_match="explicit")
# grid_match            = "explicit"     # "explicit" (use grid_index) | "nearest" ([site] lat/lon -> nearest cell)
#   --------------------------------------------------------------------------------------------
#   ---- The forcing's own heights (docs/science/forcing.md §8). Every sample is moved from them to
#   the top of each patch's canopy air space (its canopy-air depth, which grows with the stand):
#   potential temperature and humidity are conserved, and the wind follows the patch's own log
#   profile. Values below are ERA5-Land's; a flux tower gives its sensor heights above the ground,
#   height_above = "ground" and wind_exposure = "local" (examples/example04_column_biophysics).
# tq_height             = 2.0            # [m] height of air temperature and humidity
# wind_height           = 10.0           # [m] height of the wind
# height_above          = "zero_plane"   # "zero_plane" (a reanalysis: its model has no displacement
#                                        # height) | "ground" (a flux tower above this canopy)
# wind_exposure         = "open_terrain" # "open_terrain" (ERA5's 10 m wind, made for open terrain) |
#                                        # "local" (measured over this canopy)
# wind_exposure_z0      = 0.03           # [m] "open_terrain" only: the roughness it was made for
# wind_blending_height  = 40.0           # [m] "open_terrain" only: the height it came down from
#   --------------------------------------------------------------------------------------------
# timestep              = "3600s"        # native forcing interval (ERA5-Land hourly)
# avg_convention        = "end"          # flux vars mean over the interval ENDING at the stamp;
#                                        # "begin" for one BEGINNING there (AmeriFlux TIMESTAMP_START)
# sw_partition          = "clearidx"     # total SW -> streams: "clearidx" (Erbs) | "weiss_norman" | "passthrough"
# lwdown_source         = "file"         # ERA5-Land has strd; "synthesize" builds it from T, q and cloudiness
# lw_clear_form         = "brutsaert"    # lwdown_source = "synthesize" only: clear-sky emissivity, "brutsaert"
#                                        # (screen-level vapour pressure) | "idso" (temperature alone)
# lw_cloud_a            = 0.22           # [-] lwdown_source = "synthesize" only: cloud term (1 + a(1-kt))
#   ---- CO2: never from the met file (one that carries CO2air is rejected) ----------------------
# co2_source            = "const"        # "const" (default) | "file": the CO2 on MODEL time, every backend
# co2_const             = 420.0          # [umol/mol] co2_source = "const" only
# co2_file              = "data/co2/co2_cmip7_global_annual_1000-2022.txt"
#                                        # co2_source = "file" only: a MEDS CO2 file, relative to where MEDS
#                                        # runs. The shipped one is CMIP7 global annual means, 1000-2022;
#                                        # its header defines the format (docs/science/forcing.md §12).
#                                        # Linear between period middles; a run it does not cover is refused.
#   --------------------------------------------------------------------------------------------
# recycle               = true           # cycle the forcing when the run outruns the file (forcing.md §9)
#
#   RECYCLING IS DECLARED, NEVER INFERRED. When recycle = true, both keys below are REQUIRED and
#   MEDS validates them rather than guessing anything about the file:
#
#     recycle_start   first instant of the cycle (INCLUSIVE). Must land EXACTLY on a record stamp
#                     in the forcing file -- a mismatch is a hard error naming both values, never a
#                     silent re-derivation. Mind avg_convention: an "end" file (ERA5-Land) stamps
#                     the END of each interval, so the first record of a calendar year is 01:00:00
#                     for hourly data, NOT 00:00:00.
#     recycle_end     first instant AFTER the cycle (EXCLUSIVE). recycle_end - recycle_start must be
#                     an EXACT whole number of calendar years. Any other span drifts both hour-of-day
#                     and day-of-year on every wrap, while the daily MEAN shortwave stays correct --
#                     so the error hides from every slow diagnostic. Rejected in the config check.
#
#   The window may start anywhere in the calendar (a mid-year cycle is fine); only the SPAN must be
#   whole years. It may also be a sub-range of a longer file.
#
#   LEAP DAY: mapping preserves month/day/time-of-day exactly. When a leap model year asks for
#   Feb-29 and the target file year is not a leap year, it reads Feb-28 instead (ED2 read_ol_file
#   repeats Feb 28). The substitution is one-directional -- a non-leap model year never asks for
#   Feb-29 -- so no file data is ever skipped or double-counted by it.
#
# recycle_start         = "2024-01-01 01:00:00"
# recycle_end           = "2025-01-01 01:00:00"
# start_clamp           = "error"        # model start < first record: "error" | "hold"

#-------------------------------------------------------------------------------------------------#
# [region] -- ONLY with [run].mode = "region" (a [region] block in a site run is refused).         #
# Every valid cell of the box with enough land becomes a polygon at its cell centre and orography, #
# so [site].latitude/longitude/elevation and [forcing].max_distance_km are refused in region mode.  #
# Needs format = "ED_ERA5land" and the [maps] soil maps. Starts from bare ground (init_mode = 0)  #
# or a region state file (init_mode = 2); [state].write_state writes one, every polygon in it.      #
#-------------------------------------------------------------------------------------------------#
# [region]
# box_nwse          = [42.95, -76.95, 41.95, -75.95]  # [N, W, S, E] in degrees; may cross 0 or 180
# land_fraction_min = 0.5            # default 0.5: skip lakes and fractional coastal cells
# cell_mask         = ""             # a map on the forcing grid: a cell runs where cell_mask_var >=
#                                    # cell_mask_min, and is skipped where below or empty ("" = off)
# cell_mask_var     = "mask"         # the mask's variable, (lat, lon)
# cell_mask_min     = 0.5            # default 0.5: a 0/1 mask works as is; a fraction takes a threshold

#-------------------------------------------------------------------------------------------------#
# [maps] -- the static maps a run takes its soil and its Chave site index from, each on the       #
# ED_ERA5land grid (so they need format = "ED_ERA5land"); docs/configuration.md "Input maps".      #
# A region needs the three soil maps, and chave_e_map with height_allometry = "chave2014". A site  #
# may use them too, read at its forcing cell, in place of setting [soil_column] by hand. With the   #
# soil maps set, every key they provide is refused: soil_column.depth, layer_bottoms, retention     #
# and the texture keys, soil.bottom_bc, energy.deep_temp and deep_depth, and init.soil_theta (each  #
# layer then starts at its field capacity). soil_column.psi_fc still defines that capacity.         #
#-------------------------------------------------------------------------------------------------#
# [maps]
# soil_depth_map     = "/path/to/ED_ERA5land_soil_depth_v2.nc"
#                    #   soil_depth [m], bc_class (1 free_drain; 2 leaky, run as free_drain, as there is
#                    #   no leaky bottom boundary (see docs/ROADMAP.md); 3 sealed, run as bedrock;
#                    #   4 aquifer) and deep_temp [K], each (lat, lon)
# soil_texture_map   = "/path/to/ED_ERA5land_soil_texture_v2.nc"
#                    #   sand, silt, clay [%], bulk_density [g/cm3] and coarse_fragments [% volume],
#                    #   each (depth, lat, lon), with the layers in depth_bnds [m]
# soil_chemistry_map = "/path/to/ED_ERA5land_soil_biogeochemical_properties_v2.nc"
#                    #   organic_carbon [g/kg], cec [cmol(c)/kg] and ph_h2o, on the same layers
# chave_e_map        = "/path/to/ED_ERA5land_Chave2014_E.nc"
#                    #   chave_e (lat, lon), Chave et al. (2014)'s E; allometry.chave_e is then refused
